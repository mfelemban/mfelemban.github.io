<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FHE Scheme Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a lab bench. Sticky parameter rail on the left, a vertical stack of step cards on the right; one hue per scheme. */
:root {
  --paper: #f4f6f8; --panel: #ffffff; --ink: #18202b; --muted: #5b6676; --line: #d9dee5; --soft: #eaeef2;
  --bfv: #3a48a3; --bgv: #0f766e; --ckks: #a1600f; --tfhe: #8b3a86; --gsw: #a33a55; --compare: #3d4a5c;
  --accent: var(--bfv); --accent-soft: #e6e9f7;
  --ok: #2e7d4a; --ok-soft: #e3f2e8; --bad: #b8382f; --bad-soft: #f9e3e1; --warn: #a66a00; --warn-soft: #fbf0d9;
  --band1: #eef1f6; --band2: #e2e7f0;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #11161d; --panel: #18202a; --ink: #e6ebf1; --muted: #9aa6b5; --line: #2b3542; --soft: #1f2833;
  --bfv: #8f9cf0; --bgv: #4fc2b4; --ckks: #e2a24f; --tfhe: #d78ad1; --gsw: #ee8aa3; --compare: #a9b8cc; --accent-soft: #232b45;
  --ok: #6fcf8f; --ok-soft: #173325; --bad: #f08a80; --bad-soft: #3a1f1d; --warn: #e8b85a; --warn-soft: #3a2f17;
  --band1: #1d2530; --band2: #253041; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #11161d; --panel: #18202a; --ink: #e6ebf1; --muted: #9aa6b5; --line: #2b3542; --soft: #1f2833;
  --bfv: #8f9cf0; --bgv: #4fc2b4; --ckks: #e2a24f; --tfhe: #d78ad1; --gsw: #ee8aa3; --compare: #a9b8cc; --accent-soft: #232b45;
  --ok: #6fcf8f; --ok-soft: #173325; --bad: #f08a80; --bad-soft: #3a1f1d; --warn: #e8b85a; --warn-soft: #3a2f17;
  --band1: #1d2530; --band2: #253041; color-scheme: dark; }
:root[data-scheme="bfv"] { --accent: var(--bfv); } :root[data-scheme="bgv"] { --accent: var(--bgv); }
:root[data-scheme="ckks"] { --accent: var(--ckks); } :root[data-scheme="tfhe"] { --accent: var(--tfhe); }
:root[data-scheme="gsw"] { --accent: var(--gsw); } :root[data-scheme="compare"] { --accent: var(--compare); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-body); }
.mono, code, td.mono { font-family: var(--f-mono); font-size: 0.86em; font-variant-numeric: tabular-nums; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.topin { max-width: 1320px; margin: 0 auto; padding: 10px 20px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.brand { font: 700 19px/1 var(--f-display); letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 10px; }
.brand small { font: 400 13px var(--f-body); color: var(--muted); }
.backlink { font: 600 13px var(--f-body); color: var(--muted); text-decoration: none; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
.backlink:hover, .backlink:focus-visible { color: var(--ink); border-color: var(--muted); }
@media (max-width: 1360px) and (min-width: 901px) { .brand small { display: none; } }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.tabs a { text-decoration: none; color: var(--muted); font: 600 14px var(--f-body); padding: 7px 14px; border-radius: 999px; border: 1px solid transparent; }
.tabs a:hover { color: var(--ink); border-color: var(--line); }
.tabs a[aria-current="page"] { color: var(--panel); background: var(--accent); }
.tabs a .sub { font-weight: 400; opacity: .8; margin-left: 4px; font-size: 12px; }
#host { max-width: 1320px; margin: 0 auto; padding: 18px 20px 60px; }
.page { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); max-height: calc(100vh - 80px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.side h3 { margin: 0; font: 700 15px var(--f-display); letter-spacing: .02em; text-transform: uppercase; color: var(--accent); }
.side h4 { margin: 4px 0; font: 600 13px var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field.span2, .fgrid .field:has(input[id$="primes"]), .fgrid .field:has(input[id$="-m1"]), .fgrid .field:has(input[id$="-m2"]), .fgrid .field:has(input[id^="ck-z"]) { grid-column: span 2; }
.flabel { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); }
input, select { font: 14px var(--f-mono); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; width: 100%; }
.row input, .builder input, .builder select { width: auto; }
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 6px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; }
.check input { width: auto; margin-top: 3px; }
.btn { font: 600 13.5px var(--f-body); border-radius: 7px; padding: 7px 13px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.small { padding: 4px 9px; font-size: 12.5px; }

.fgrid .span2 { grid-column: span 2; }
.derived { border-top: 1px dashed var(--line); padding-top: 10px; }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; font-family: var(--f-mono); font-size: 12.5px; text-align: right; overflow-wrap: anywhere; }
dl.kv.wide dd { text-align: left; }
.main { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.lede h2 { margin: 2px 0 4px; font: 700 34px/1.05 var(--f-display); letter-spacing: -0.02em; color: var(--accent); }
.lede p { margin: 0; max-width: 72ch; color: var(--ink); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.keys { border-left: 4px solid var(--accent); }
.card.error { border-color: var(--bad); background: var(--bad-soft); }
.card.error p { margin: 0; }
.chead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.chead h4 { margin: 0; font: 700 17px var(--f-display); }
.chead h5, .card h5 { margin: 6px 0 0; font: 700 14px var(--f-display); color: var(--accent); }
.cname { background: var(--accent-soft); color: var(--accent); padding: 1px 8px; border-radius: 5px; font-weight: 600; }
.operands { color: var(--muted); }
.chip { font: 600 11.5px var(--f-body); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); letter-spacing: .02em; }
.chip.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.chip.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.chip.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.formula { font-family: var(--f-mono); font-size: 13px; background: var(--soft); border-radius: 6px; padding: 7px 10px; overflow-x: auto; }
.summary { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 14px; align-items: center; }
.res { display: flex; flex-direction: column; gap: 2px; padding: 9px 12px; border-radius: 8px; min-width: 0; }
.res.ok { background: var(--ok-soft); } .res.bad { background: var(--bad-soft); } .res.warnres { background: var(--warn-soft); }
.res .big { font: 700 15px var(--f-display); }
.res.ok .big { color: var(--ok); } .res.bad .big { color: var(--bad); } .res.warnres .big { color: var(--warn); }
.res .mono { overflow-wrap: anywhere; }
.gauge { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.gbar { position: relative; height: 12px; background: var(--soft); border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.gfill { height: 100%; background: var(--ok); transition: width .35s ease; }
.gauge.warn .gfill { background: var(--warn); } .gauge.bad .gfill { background: var(--bad); width: 100% !important; }
.gtext { font-size: 13px; color: var(--muted); } .gtext b { color: var(--ink); }
.gauge.broken .gtext { color: var(--bad); font-weight: 600; }
details.steps { border-top: 1px solid var(--line); padding-top: 6px; }
details.steps > summary { cursor: pointer; font-weight: 600; color: var(--accent); font-size: 14px; list-style: none; }
details.steps > summary::before { content: "▸ "; } details.steps[open] > summary::before { content: "▾ "; }
.stepbody { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; min-width: 0; }
.tablewrap { overflow-x: auto; max-width: 100%; }
table.ptab { border-collapse: collapse; font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
table.ptab th, table.ptab td { padding: 2px 8px; text-align: right; white-space: nowrap; }
table.ptab thead th { color: var(--muted); font-weight: 400; border-bottom: 1px solid var(--line); }
table.ptab tbody th { text-align: left; font-family: var(--f-body); font-size: 12.5px; font-weight: 600; color: var(--muted); padding-right: 14px; }
table.ptab tr.hl td { background: var(--accent-soft); font-weight: 600; }
table.ptab tr.sep td { height: 6px; border-bottom: 1px dashed var(--line); padding: 0; }
table.ptab td.bad { color: var(--bad); font-weight: 700; }
table.ptab.compact td { padding: 1px 6px; }
table.mini { border-collapse: collapse; font-size: 12.5px; }
table.mini th, table.mini td { padding: 3px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.mini th { color: var(--muted); font-weight: 600; text-align: right; }
table.mini tbody th { text-align: left; }
table.mini tr.diff td { background: var(--warn-soft); }
.note { margin: 0; font-size: 13.5px; color: var(--muted); max-width: 80ch; }
.note b { color: var(--ink); }
.note.warnnote { color: var(--warn); font-weight: 600; }
.builder { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--panel); border: 1px dashed var(--accent); border-radius: 10px; padding: 10px 12px; }
.builder.flat { border-style: solid; border-color: var(--line); background: var(--soft); font-family: var(--f-mono); }
.blabel { font: 700 13px var(--f-display); color: var(--accent); text-transform: uppercase; letter-spacing: .05em; margin-right: 4px; }
.opfield { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
.cards { display: flex; flex-direction: column; gap: 14px; }
.cfoot { display: flex; justify-content: flex-end; gap: 10px; align-items: center; }
.fig { margin: 0; min-width: 0; }
.fig figcaption { font-size: 12.5px; color: var(--muted); margin-top: 4px; max-width: 90ch; }
svg.viz { width: 100%; height: auto; display: block; }
svg.viz .lbl { fill: var(--muted); font: 11px var(--f-mono); }
svg.viz .band1 { fill: var(--band1); } svg.viz .band2 { fill: var(--band2); }
svg.viz .axis { stroke: var(--muted); stroke-width: 1; } svg.viz .grid { stroke: var(--line); stroke-width: 1; }
svg.viz .dot.ok { fill: var(--accent); stroke: var(--panel); stroke-width: 1.5; } svg.viz .dot.bad { fill: var(--bad); stroke: var(--panel); stroke-width: 1.5; }
svg.viz .target { fill: var(--ink); opacity: .55; }
svg.viz .noiseline { stroke: var(--accent); stroke-width: 2; opacity: .55; }
svg.viz .noisebar { stroke: var(--accent); stroke-width: 6; opacity: .35; stroke-linecap: round; }
svg.viz .barE { fill: var(--muted); opacity: .55; } svg.viz .barD { fill: var(--accent); } svg.viz .barN { fill: var(--warn); }
svg.viz .box0 { fill: var(--accent); } svg.viz .box1 { fill: var(--accent); opacity: .55; }
svg.viz .hi { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 3 2; }
svg.viz .budget { stroke: var(--bad); stroke-dasharray: 4 3; } svg.viz .trace { fill: none; stroke: var(--accent); stroke-width: 2; } svg.viz .tracept { fill: var(--accent); }
svg.torus { max-width: 260px; }
svg.torus .sec1 { fill: var(--band1); stroke: var(--line); } svg.torus .sec2 { fill: var(--band2); stroke: var(--line); }
svg.torus .pad { fill: var(--warn-soft); }
svg.torus .rim { fill: none; stroke: var(--muted); }
svg.torus .hand { stroke-width: 2; stroke: var(--muted); }
svg.torus .dot.c1 { fill: var(--muted); } svg.torus .dot.c2 { fill: var(--warn); } svg.torus .dot.comb { fill: var(--accent); }
.key { display: inline-block; width: 11px; height: 11px; border-radius: 2px; vertical-align: -1px; } .keyE { background: var(--muted); opacity: .55; } .keyD { background: var(--accent); }
.two { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: center; }
.lut { display: flex; flex-wrap: wrap; gap: 8px; }
.lutcell { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--soft); }
.lutin { font: 12px var(--f-mono); color: var(--muted); }
.lutbtn { font: 700 18px var(--f-mono); width: 2.2em; border: 1px solid var(--accent); background: var(--panel); color: var(--accent); border-radius: 6px; cursor: pointer; padding: 2px 0; }
.lutbtn:hover { background: var(--accent-soft); }
.stepper input[type=range] { width: min(320px, 100%); accent-color: var(--accent); }
.rotbox { display: flex; flex-direction: column; gap: 6px; min-height: 180px; }
#flash { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 9; }

/* guided workflow */
.btn.big { padding: 11px 16px; font-size: 15px; width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { display: inline-flex; align-items: baseline; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 3px 9px; }
.pchip .pk { font-size: 12px; color: var(--muted); font-weight: 600; } .pchip .pv { font-size: 12.5px; }
.opsbar { display: flex; flex-wrap: wrap; gap: 6px; }
.opbtn { display: inline-flex; align-items: center; gap: 8px; font: 600 14px var(--f-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 8px 13px; cursor: pointer; }
.opbtn:hover:not(:disabled) { border-color: var(--accent); }
.opbtn.on { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.opbtn:disabled { opacity: .45; cursor: not-allowed; }
.opn { font: 700 11px var(--f-mono); width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.opbtn.on .opn { background: var(--panel); color: var(--accent); }
.oppanel { border-left: 4px solid var(--accent); }
.opform { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.opform .opfield { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.opform input, .opform select { width: auto; min-width: 7em; }
.why { margin: 0; max-width: 78ch; }
.card.empty { align-items: flex-start; border-style: dashed; }
.card.empty p { margin: 0; max-width: 70ch; }
.wlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.wct { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; display: flex; flex-direction: column; gap: 6px; background: var(--paper); min-width: 0; }
.wct.badct { border-color: var(--bad); }
.wtop { display: flex; gap: 8px; align-items: baseline; min-width: 0; } .wdesc { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.wchips { display: flex; flex-wrap: wrap; gap: 4px; }
.wct .gtext { font-size: 12px; }
.vizcard { border-top: 4px solid var(--accent); }
.stepper { display: flex; flex-direction: column; gap: 12px; }
.stepctl { display: flex; flex-direction: column; gap: 8px; }
.dots { display: flex; flex-wrap: wrap; gap: 5px; }
.dots .dot { font: 600 11.5px var(--f-mono); min-width: 28px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; }
.dots .dot.done { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.dots .dot.on { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.stepbody { display: flex; flex-direction: column; gap: 14px; }
.step { display: flex; flex-direction: column; gap: 9px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); min-width: 0; }
.stephead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.stepno { font: 600 11.5px var(--f-mono); color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
.stephead h5 { margin: 0; font: 700 16px var(--f-display); color: var(--ink); }
.stepres { display: grid; grid-template-columns: minmax(220px, 320px) minmax(0, 1fr); gap: 14px; align-items: center; }
table.ptab tr.new td, table.ptab tr.new th { background: var(--warn-soft); }
table.ptab td.clk { text-decoration: underline dotted var(--accent); text-underline-offset: 3px; cursor: pointer; }
table.ptab td.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.explain { font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; overflow-x: auto; }
.explain .mono { display: block; margin-top: 4px; white-space: normal; overflow-wrap: anywhere; }
.ptwrap { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
/* GSW and compare */
table.ptab td.mk { background: var(--warn-soft); font-weight: 700; }
svg.viz .trace2 { fill: none; stroke: var(--warn); stroke-width: 2; stroke-dasharray: 5 3; } svg.viz .tracept2 { fill: var(--warn); }
.keyN { background: var(--warn); }
.page.cmp { grid-template-columns: minmax(0, 1fr); }
.cmpwrap { overflow-x: auto; }
table.cmpt { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1060px; table-layout: fixed; }
table.cmpt th, table.cmpt td { vertical-align: top; padding: 8px; border-bottom: 1px solid var(--line); text-align: left; }
table.cmpt thead th { font: 700 17px var(--f-display); color: var(--accent); border-bottom: 3px solid var(--accent); position: sticky; top: 0; background: var(--panel); }
table.cmpt thead th a { color: inherit; text-decoration: none; } table.cmpt thead th .sub { font: 400 12px var(--f-body); color: var(--muted); }
table.cmpt thead th:first-child, table.cmpt tbody th { width: 112px; }
table.cmpt tbody th { font: 600 13px var(--f-body); color: var(--muted); }
table.cmpt tr.staticrow td .formula { background: transparent; padding: 0; font-family: var(--f-body); font-size: 13px; }
table.cmpt .formula.small { font-size: 12px; white-space: normal; }
table.cmpt td .live { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
table.cmpt .livect { border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; background: var(--paper); }
table.cmpt .gtext { font-size: 11.5px; }

<script>
// ===== FHE core: BigInt ring arithmetic + BFV, BGV, CKKS, TFHE =====
const B = (x) => BigInt(x);
const absB = (x) => (x < 0n ? -x : x);
function modB(a, q) { const r = a % q; return r < 0n ? r + q : r; }

function bitlen(x) { x = absB(x); return x === 0n ? 0 : x.toString(2).length; }
function log2B(x) { x = absB(x); if (x === 0n) return -Infinity; const s = x.toString(2); const L = s.length; const top = parseInt(s.slice(0, 53), 2); return Math.log2(top) + (L - Math.min(L, 53)); }

// ---- seeded PRNG ----
function mulberry32(seed) { let a = seed >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
class RNG {

  uniformB(q) { let x = 0n; const words = Math.ceil(bitlen(q) / 32) + 1; for (let i = 0; i < words; i++) x = (x << 32n) | B(this.u32()); return modB(x, q); }
  ternary(n) { return Array.from({ length: n }, () => B(this.int(-1, 1))); }
  binary(n) { return Array.from({ length: n }, () => B(this.int(0, 1))); }
  err(n, beta) { return Array.from({ length: n }, () => B(this.int(-beta, beta))); }
  uniformPoly(n, q) { return Array.from({ length: n }, () => cmodB(this.uniformB(q), q)); }
}

// ---- polynomials over Z[X]/(X^n+1), arrays of BigInt ----
const P = {

  add: (a, b) => a.map((x, i) => x + b[i]),

  neg: (a) => a.map((x) => -x),
  scal: (k, a) => a.map((x) => k * x),

    return r;
  },
  mod: (a, q) => a.map((x) => modB(x, q)),
  cmod: (a, q) => a.map((x) => cmodB(x, q)),
  norm: (a) => a.reduce((m, x) => (absB(x) > m ? absB(x) : m), 0n),
  monomial(a, k) { // X^k * a, k may be negative

    for (let i = 0; i < n; i++) { let j = i + k, s = 1n; while (j >= n) { j -= n; s = -s; } r[j] += s * a[i]; }
    return r;
  },
};
function encodeBase(m, base, n) { // non-negative integer -> poly
  const c = Array(n).fill(0n); let x = BigInt(m); let i = 0; const digits = [];
  while (x > 0n) { digits.push(x % B(base)); x /= B(base); }
  for (const d of digits) { if (i < n) c[i] += d; else { // wrap with sign flip
      let j = i, s = 1n; while (j >= n) { j -= n; s = -s; } c[j] += s * d; } i++; }

}
function decodeBase(M, base, t) { // M coeffs in Z_t -> integer, reading residues in [0,t)
  let v = 0n, p = 1n; for (const x of M) { v += modB(x, B(t)) * p; p *= B(base); } return v;
}

// =================== BFV ===================
function bfvRun(cfg) {
  const n = cfg.n, t = B(cfg.t), q = B(cfg.q), beta = cfg.beta, w = B(cfg.w);
  const rng = new RNG(cfg.seed);

  const L = []; let tmp = 1n, ell = 0; while (tmp < q) { tmp *= w; ell++; }
  const fix = cfg.fixed || {};

  const a = fix.a ? P.cmod(fix.a.map(B), q) : rng.uniformPoly(n, q);
  const e = fix.e ? fix.e.map(B) : rng.err(n, beta);
  const aSK = P.mul(a, SK);
  const PK0 = P.cmod(P.neg(P.add(aSK, e)), q), PK1 = a;
  const SK2 = P.mul(SK, SK);
  // relin keys (gadget), keys reuse fixed a', e' if given
  const EK = [];
  for (let i = 0; i < ell; i++) {
    const ai = fix.ap ? P.cmod(fix.ap.map(B), q) : rng.uniformPoly(n, q);
    const ei = fix.ep ? fix.ep.map(B) : rng.err(n, beta);
    EK.push({ a: ai, e: ei, b: P.cmod(P.add(P.neg(P.add(P.mul(ai, SK), ei)), P.scal(w ** B(i), SK2)), q) });
  }
  const EKbasic = { a: EK[0].a, e: EK[0].e, b: EK[0].b }; // w^0 key = basic EK
  const keys = { SK, a, e, aSK, PK0, PK1, SK2, EK, EKbasic, ell, check: P.cmod(P.add(PK0, aSK), q) };
  const params = { n, t, q, D, qt, beta, w, ell, budget: q / (2n * t), fresh: B(2 * n * beta * 1 + beta), G: 2n * t * B(n) * B(n) };
  const regs = {};
  const ptMul = (A, Bp) => P.mod(P.mul(A, Bp), t);
  function decrypt(c, Mexp) {
    let val = P.add(c[0], P.mul(c[1], SK));
    const parts = { c1SK: P.mul(c[1], SK) };
    if (c.length === 3) { parts.c2SK2 = P.mul(c[2], SK2); val = P.add(val, parts.c2SK2); }
    const r = P.cmod(val, q);
    const scaled = r.map((x) => Number(x * t * 10000n / q) / 10000); // display
    const rounded = r.map((x) => roundDiv(x * t, q));
    const M = rounded.map((x) => modB(x, t));
    const Mc = Mexp.map((x) => cmodB(x, t));
    const v = P.cmod(r.map((x, i) => x - D * Mc[i]), q);
    const ok = M.every((x, i) => x === modB(Mexp[i], t));

  }
  function fresh(Mpoly, label, fx) {
    const u = fx && fx.u ? fx.u.map(B) : rng.ternary(n);
    const e1 = fx && fx.e1 ? fx.e1.map(B) : rng.err(n, beta);
    const e2 = fx && fx.e2 ? fx.e2.map(B) : rng.err(n, beta);
    const PK0u = P.mul(PK0, u), PK1u = P.mul(PK1, u);
    const DM = P.scal(D, Mpoly);
    const c0 = P.cmod(P.add(P.add(PK0u, e1), DM), q), c1 = P.cmod(P.add(PK1u, e2), q);
    const vdirect = P.add(P.add(P.neg(P.mul(e, u)), e1), P.mul(e2, SK));
    return { c: [c0, c1], M: P.mod(Mpoly, t), steps: { u, e1, e2, PK0u, PK1u, DM, vdirect } };
  }
  function exec(op) {
    const X = regs[op.a], Y = regs[op.b];
    if (op.op === 'enc') { const r = fresh(op.M, op.name, op.fx); return { ...r, kind: 'enc' }; }
    if (op.op === 'add') {
      if (X.c.length !== Y.c.length) throw new Error('Add needs two ciphertexts of the same size (relinearize first).');
      return { kind: 'add', c: X.c.map((p, i) => P.cmod(P.add(p, Y.c[i]), q)), M: P.mod(P.add(X.M, Y.M), t) };
    }
    if (op.op === 'addp') { const Mp = op.M; return { kind: 'addp', c: [P.cmod(P.add(X.c[0], P.scal(D, Mp)), q), ...X.c.slice(1)], M: P.mod(P.add(X.M, Mp), t), steps: { Mp } }; }
    if (op.op === 'mulp') { const Mp = P.cmod(op.M, t); return { kind: 'mulp', c: X.c.map((p) => P.cmod(P.mul(p, Mp), q)), M: ptMul(X.M, op.M), steps: { Mp } }; }
    if (op.op === 'mul') {
      if (X.c.length !== 2 || Y.c.length !== 2) throw new Error('EvalMult takes two 2-part ciphertexts. Relinearize first.');
      const [a0, a1] = X.c, [b0, b1] = Y.c;
      const T = [P.mul(a0, b0), P.add(P.mul(a0, b1), P.mul(a1, b0)), P.mul(a1, b1)];
      const R = T.map((p) => p.map((x) => roundDiv(x * t, q)));
      const c = R.map((p) => P.cmod(p, q));

      if (X.c.length !== 3) throw new Error('Relinearize takes a 3-part ciphertext (the output of EvalMult).');
      const [c0, c1, c2] = X.c;
      if (op.mode === 'basic') {
        const h0 = P.cmod(P.add(c0, P.mul(EKbasic.b, c2)), q), h1 = P.cmod(P.add(c1, P.mul(EKbasic.a, c2)), q);
        return { kind: 'relin', mode: 'basic', c: [h0, h1], M: X.M, steps: { c2 } };

      for (let i = 0; i < ell; i++) digits.push(c2p.map((x) => (x / (w ** B(i))) % w));
      let h0 = c0, h1 = c1;
      digits.forEach((d, i) => { h0 = P.add(h0, P.mul(d, EK[i].b)); h1 = P.add(h1, P.mul(d, EK[i].a)); });
      return { kind: 'relin', mode: 'gadget', c: [P.cmod(h0, q), P.cmod(h1, q)], M: X.M, steps: { c2p, digits } };
    }
    throw new Error('Unknown operation');
  }
  for (const op of cfg.program) {
    try { const r = exec(op); r.op = op; r.dec = decrypt(r.c, r.M); regs[op.name] = r; }
    catch (err) { regs[op.name] = { op, error: err.message }; }
  }
  return { params, keys, regs };
}

// =================== BGV ===================
function isPrime(x) { if (x < 2) return false; if (x % 2 === 0) return x === 2; for (let d = 3; d * d <= x; d += 2) if (x % d === 0) return false; return true; }
function findPrimes(t, count, bits, avoid = []) { // primes p ≡ 1 mod t near 2^bits, descending
  const out = []; let k = Math.floor((2 ** bits - 1) / t);
  while (out.length < count && k > 0) { const p = k * t + 1; if (isPrime(p) && !avoid.includes(p) && !out.includes(p)) out.push(p); k--; }
  return out;
}
function bgvRun(cfg) {
  const n = cfg.n, t = B(cfg.t), beta = cfg.beta, w = B(cfg.w);
  const primes = cfg.primes.map(B); // p0..pL
  const Lmax = primes.length - 1;
  const qs = []; let acc = 1n; for (const p of primes) { acc *= p; qs.push(acc); }
  const qL = qs[Lmax];
  const rng = new RNG(cfg.seed); const fix = cfg.fixed || {};
  let ell = 0, tmp = 1n; while (tmp < qL) { tmp *= w; ell++; }
  const SK = fix.SK ? fix.SK.map(B) : rng.ternary(n);
  const a = fix.a ? P.cmod(fix.a.map(B), qL) : rng.uniformPoly(n, qL);
  const e = fix.e ? fix.e.map(B) : rng.err(n, beta);
  const aSK = P.mul(a, SK);
  const PK0 = P.cmod(P.neg(P.add(aSK, P.scal(t, e))), qL), PK1 = a;
  const SK2 = P.mul(SK, SK);
  const EK = [];
  for (let i = 0; i < ell; i++) { const ai = rng.uniformPoly(n, qL), ei = rng.err(n, beta);
    EK.push({ a: ai, e: ei, b: P.cmod(P.add(P.neg(P.add(P.mul(ai, SK), P.scal(t, ei))), P.scal(w ** B(i), SK2)), qL) }); }
  const keys = { SK, a, e, aSK, PK0, PK1, SK2, EK, ell, check: P.cmod(P.add(PK0, aSK), qL) };
  const params = { n, t, beta, w, primes, qs, Lmax, ell, fresh: B(2 * n * beta + beta), congr: primes.map((p, i) => i === 0 ? null : modB(p, t) === 1n) };
  const regs = {};
  const ptMul = (A, Bp) => P.mod(P.mul(A, Bp), t);
  function decrypt(c, lvl, Mexp) {
    const q = qs[lvl];
    let val = P.add(c[0], P.mul(c[1], SK)); const parts = { c1SK: P.mul(c[1], SK) };
    if (c.length === 3) { parts.c2SK2 = P.mul(c[2], SK2); val = P.add(val, parts.c2SK2); }
    const r = P.cmod(val, q);
    const M = r.map((x) => modB(x, t));
    const Mc = Mexp.map((x) => cmodB(x, t));
    const diff = r.map((x, i) => x - Mc[i]);
    const divisible = diff.every((x) => x % t === 0n);
    const v = diff.map((x) => (x % t === 0n ? x / t : null));
    const ok = M.every((x, i) => x === modB(Mexp[i], t));
    const vn = v.every((x) => x !== null) ? P.norm(v) : null;
    return { val, r, M, v, norm: vn, ok, divisible, parts, budget: q / (2n * t), q };
  }
  function modswitchPoly(p, q, qn) { // nearest integer to (qn/q)c congruent to c mod t
    const rows = [];
    const out = p.map((c) => {
      const res = modB(c, t); const num = c * qn; // x = num / q
      const base = floorDiv(num, q); // floor(x)
      // candidate k ≡ res (mod t) near x
      let k0 = base - modB(base - res, t); // <= base, ≡ res
      const cands = [k0, k0 + t, k0 - t, k0 + 2n * t];
      let best = cands[0], bd = absB(cands[0] * q - num);
      for (const k of cands) { const d = absB(k * q - num); if (d < bd) { bd = d; best = k; } }
      rows.push({ c, res, x: Number(num * 1000n / q) / 1000, plain: roundDiv(num, q), k: best });
      return best;
    });
    return { out, rows };
  }
  function exec(op) {
    const X = regs[op.a], Y = regs[op.b];
    if (op.op === 'enc') {
      const fx = op.fx || {};
      const u = fx.u ? fx.u.map(B) : rng.ternary(n), e1 = fx.e1 ? fx.e1.map(B) : rng.err(n, beta), e2 = fx.e2 ? fx.e2.map(B) : rng.err(n, beta);
      const c0 = P.cmod(P.add(P.add(P.mul(PK0, u), P.scal(t, e1)), op.M), qL), c1 = P.cmod(P.add(P.mul(PK1, u), P.scal(t, e2)), qL);
      return { kind: 'enc', c: [c0, c1], lvl: Lmax, M: P.mod(op.M, t), steps: { u, e1, e2, vdirect: P.add(P.add(P.neg(P.mul(e, u)), e1), P.mul(e2, SK)) } };
    }
    if (op.op === 'add') {
      if (X.c.length !== Y.c.length) throw new Error('Add needs two ciphertexts of the same size.');
      if (X.lvl !== Y.lvl) throw new Error(`Levels differ (${X.lvl} and ${Y.lvl}). ModSwitch the higher one down first.`);
      const q = qs[X.lvl];
      return { kind: 'add', c: X.c.map((p, i) => P.cmod(P.add(p, Y.c[i]), q)), lvl: X.lvl, M: P.mod(P.add(X.M, Y.M), t) };
    }
    if (op.op === 'addp') { const q = qs[X.lvl]; return { kind: 'addp', c: [P.cmod(P.add(X.c[0], op.M), q), ...X.c.slice(1)], lvl: X.lvl, M: P.mod(P.add(X.M, op.M), t) }; }
    if (op.op === 'mulp') { const q = qs[X.lvl]; const Mp = P.cmod(op.M, t); return { kind: 'mulp', c: X.c.map((p) => P.cmod(P.mul(p, Mp), q)), lvl: X.lvl, M: ptMul(X.M, op.M) }; }
    if (op.op === 'mul') {
      if (X.c.length !== 2 || Y.c.length !== 2) throw new Error('EvalMult takes two 2-part ciphertexts. Relinearize first.');
      if (X.lvl !== Y.lvl) throw new Error(`Levels differ (${X.lvl} and ${Y.lvl}). ModSwitch first.`);
      const q = qs[X.lvl]; const [a0, a1] = X.c, [b0, b1] = Y.c;
      const T = [P.mul(a0, b0), P.add(P.mul(a0, b1), P.mul(a1, b0)), P.mul(a1, b1)];
      return { kind: 'mul', c: T.map((p) => P.cmod(p, q)), lvl: X.lvl, M: ptMul(X.M, Y.M), steps: { T } };
    }
    if (op.op === 'relin') {
      if (X.c.length !== 3) throw new Error('Relinearize takes a 3-part ciphertext.');
      const q = qs[X.lvl]; const [c0, c1, c2] = X.c; const c2p = P.mod(c2, q); const digits = [];
      for (let i = 0; i < ell; i++) digits.push(c2p.map((x) => (x / (w ** B(i))) % w));
      let h0 = c0, h1 = c1; digits.forEach((d, i) => { h0 = P.add(h0, P.mul(d, EK[i].b)); h1 = P.add(h1, P.mul(d, EK[i].a)); });
      return { kind: 'relin', c: [P.cmod(h0, q), P.cmod(h1, q)], lvl: X.lvl, M: X.M, steps: { c2p, digits } };
    }
    if (op.op === 'ms') {
      if (X.lvl === 0) throw new Error('Already at level 0: there is no prime left to drop.');
      const q = qs[X.lvl], qn = qs[X.lvl - 1];
      const res = X.c.map((p) => modswitchPoly(p, q, qn));
      return { kind: 'ms', c: res.map((r) => P.cmod(r.out, qn)), lvl: X.lvl - 1, M: X.M, steps: { rows: res.map((r) => r.rows), dropped: primes[X.lvl], legal: modB(primes[X.lvl], t) === 1n } };
    }
    throw new Error('Unknown operation');
  }
  for (const op of cfg.program) {
    try { const r = exec(op); r.op = op; r.dec = decrypt(r.c, r.lvl, r.M); regs[op.name] = r; }
    catch (err) { regs[op.name] = { op, error: err.message }; }
  }
  return { params, keys, regs };
}

// =================== CKKS ===================
// complex helpers
const C = { add: (a, b) => [a[0] + b[0], a[1] + b[1]], mul: (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]], conj: (a) => [a[0], -a[1]], exp: (th) => [Math.cos(th), Math.sin(th)] };
function ckksRoots(n) { // slot j uses root zeta^(5^j mod 2n); conjugates fill the rest
  const roots = []; let g = 1; const M = 2 * n;
  for (let j = 0; j < n / 2; j++) { roots.push(g); g = (g * 5) % M; }
  return roots;
}
function ckksEncode(z, n, scale) { // z: array of reals/complex [re,im], length n/2 -> BigInt poly
  const exps = ckksRoots(n), M = 2 * n; const vals = new Map();
  exps.forEach((k, j) => { const zj = Array.isArray(z[j]) ? z[j] : [z[j] || 0, 0]; vals.set(k, zj); vals.set(M - k, C.conj(zj)); });
  const coeffs = [];
  for (let k = 0; k < n; k++) { let s = [0, 0]; for (const [r, v] of vals) s = C.add(s, C.mul(v, C.exp(-Math.PI * r * k / n))); coeffs.push(s[0] / n); }
  return coeffs.map((x) => BigInt(Math.round(x * scale)));
}
function ckksDecode(m, n, scale) { // BigInt poly (centered) -> complex slots
  const exps = ckksRoots(n);
  return exps.map((k) => { let s = [0, 0]; m.forEach((c, i) => { s = C.add(s, C.mul([Number(c) / scale, 0], C.exp(Math.PI * k * i / n))); }); return s; });
}
function ckksRun(cfg) {
  const n = cfg.n, beta = cfg.beta, logD = cfg.logDelta, logq0 = cfg.logq0, Lmax = cfg.L;
  const w = 2n ** B(cfg.logw);
  const qs = []; for (let l = 0; l <= Lmax; l++) qs.push(2n ** B(logq0 + l * logD));
  const qL = qs[Lmax]; const Delta = 2 ** logD;

  }
  const ops = [

// ============ CKKS ============
function ckksDef() {
  const presets = [
    { label: 'Default (n = 8, Δ = 2^20, 2 levels)', p: { n: 8, logDelta: 20, logq0: 30, L: 2, beta: 2, logw: 10, seed: 3 } },
    { label: 'Low precision (Δ = 2^8)', p: { n: 8, logDelta: 8, logq0: 14, L: 2, beta: 2, logw: 6, seed: 5 } },
    { label: 'Small (n = 4, one level)', p: { n: 4, logDelta: 16, logq0: 24, L: 1, beta: 1, logw: 8, seed: 9 } },
  ];
  const fields = () => [
    { key: 'n', label: 'Ring degree n', type: 'select', options: [4, 8, 16], num: true, hint: 'n/2 slots' },
    { key: 'logDelta', label: 'Scale Δ = 2^', type: 'number', min: 4, max: 40 },
    { key: 'logq0', label: 'Base modulus q₀ = 2^', type: 'number', min: 6, max: 60 },
    { key: 'L', label: 'Levels L', type: 'number', min: 0, max: 5, hint: 'q<sub>ℓ</sub> = q₀·Δ<sup>ℓ</sup>' },
    { key: 'beta', label: 'Error bound β', type: 'number', min: 0, max: 64 },
    { key: 'logw', label: 'Relin base w = 2^', type: 'number', min: 1, max: 30 },
    { key: 'seed', label: 'Random seed', type: 'number', extra: (pp, done) => h('button', { class: 'btn small', type: 'button', onclick: () => { pp.seed = Math.floor(Math.random() * 1e6); done(); } }, 'Randomise') },
  ];
  function derive(p) {
    const n = Number(p.n), lD = Number(p.logDelta), lq0 = Number(p.logq0), L = Number(p.L), lw = Number(p.logw), beta = Number(p.beta);
    if (lq0 <= lD) return { error: 'q₀ must exceed Δ so the last level can hold values of size 1.' }; if (!(lw >= 1)) return { error: 'w must be at least 2.' };
    const qs = Array.from({ length: L + 1 }, (_, l) => 2n ** BigInt(lq0 + l * lD)); const qL = qs[L]; const w = 2n ** BigInt(lw); let ell = 0, tmp = 1n; while (tmp < qL) { tmp *= w; ell++; }
    return { n, lD, lq0, L, qs, qL, w, ell, beta, Delta: 2 ** lD, chips: [['n', n], ['slots', n / 2], ['Δ', `2<sup>${lD}</sup>`], ['q₀', `2<sup>${lq0}</sup>`], ['L', L], ['q<sub>L</sub>', `2<sup>${lq0 + L * lD}</sup>`], ['β', beta]],
      list: qs.map((q, l) => [`q<sub>${l}</sub>`, `2<sup>${lq0 + l * lD}</sup>, values up to 2<sup>${lq0 + l * lD - lD - 1}</sup>`]).concat([['Relin keys ℓ', ell]]) };
  }
  function keygen(p, d) {
    const n = d.n, rng = new RNG(Number(p.seed) || 1), q = d.qL; const steps = [];
    steps.push({ title: 'Parameters', why: 'CKKS uses a power-of-two modulus chain here: each Rescale divides by Δ and drops one level.', node: paramChips(d.chips) });
    const SK = rng.ternary(n); steps.push({ title: 'Sample SK', table: [{ label: 'SK', v: SK, cls: 'new' }] });
    const a = rng.uniformPoly(n, q), e = rng.err(n, d.beta); steps.push({ title: 'Sample a and e', table: [{ label: 'a', v: a, q, cls: 'new' }, { label: 'e', v: e, cls: 'new' }] });
    const ms = shiftSteps(a, SK, { pName: 'a', sName: 'SK', q, title: 'Compute a·SK' }); steps.push(...ms.steps);
    const PK0 = P.cmod(P.neg(P.add(ms.value, e)), q); steps.push({ title: 'Form PK and check', formula: 'PK₀ = [−(a·SK + e)]<sub>q<sub>L</sub></sub>, PK₁ = a, PK₀ + PK₁·SK = −e', table: [{ label: 'PK₀', v: PK0, q, cls: 'hl' }, { label: 'PK₁', v: a, q, cls: 'hl' }, '-', { label: 'PK₀ + PK₁·SK', v: P.cmod(P.add(PK0, ms.value), q) }, { label: '−e', v: P.neg(e) }] });
    const SK2 = P.mul(SK, SK); const EK = []; for (let i = 0; i < d.ell; i++) { const ai = rng.uniformPoly(n, q), ei = rng.err(n, d.beta); EK.push({ a: ai, b: P.cmod(P.add(P.neg(P.add(P.mul(ai, SK), ei)), P.scal(d.w ** BigInt(i), SK2)), q) }); }
    steps.push({ title: 'Evaluation keys', formula: `EK<sup>(i)</sup> encrypts w<sup>i</sup>·SK², w = 2<sup>${p.logw}</sup>, ℓ = ${d.ell}`, table: EK.slice(0, 4).flatMap((k, i) => [{ label: `EK<sup>(${i})</sup>₀`, v: k.b, q }, { label: `EK<sup>(${i})</sup>₁`, v: k.a, q }]) });

  }
  function dec(ctx, ct) { const q = ctx.d.qs[ct.lvl]; let val = P.add(ct.c[0], P.mul(ct.c[1], ctx.SK)); if (ct.c.length === 3) val = P.add(val, P.mul(ct.c[2], ctx.SK2)); const m = P.cmod(val, q); const z = ckksDecode(m, ctx.d.n, 2 ** ct.scaleLog); const err = z.map((zz, j) => Math.hypot(zz[0] - ct.z[j][0], zz[1] - ct.z[j][1])); const maxErr = Math.max(...err); return { val, m, z, err, maxErr, bits: maxErr > 0 ? -Math.log2(maxErr) : 52 }; }
  function ctInfo(ct, ctx) { const dd = dec(ctx, ct); const room = ctx.d.lq0 + ct.lvl * ctx.d.lD - 1 - ct.scaleLog; return { ok: dd.maxErr < 0.5, chips: [[`${ct.c.length} parts`, ct.c.length === 3 ? 'warn' : 'muted'], [`level ${ct.lvl}`], [`scale 2<sup>${ct.scaleLog}</sup>`, ct.scaleLog > ctx.d.lD ? 'warn' : 'muted'], [`${dd.bits.toFixed(1)} bits`, dd.bits < 6 ? 'bad' : 'ok'], [`room 2<sup>${room}</sup>`]], gauge: null }; }
  const parseZ = (str, k) => { const v = String(str).split(',').map((x) => x.trim()).filter(Boolean).map(Number); if (!v.length || v.some((x) => !Number.isFinite(x))) throw new Error('Slot values must be real numbers separated by commas.'); while (v.length < k) v.push(0); return v.slice(0, k); };
  function encOp(api, str) {
    const ctx = api.ctx, d = ctx.d, n = d.n, k = n / 2, q = d.qL, rng = ctx.rng; const z = parseZ(str, k); const steps = [];

    const ctx = api.ctx, d = ctx.d; if (A.c.length !== 3) throw new Error('Relinearize takes a 3-part ciphertext.'); const q = d.qs[A.lvl]; const [c0, c1, c2] = A.c; const steps = [];
    const c2p = P.mod(c2, q); const digits = []; for (let i = 0; i < d.ell; i++) digits.push(c2p.map((x) => (x / (d.w ** BigInt(i))) % d.w));

// ============ TFHE ============
function tfheDef() {
  const presets = [
    { label: 'Lecture 15 instance', p: { logq: 10, p: 8, n: 3, N: 16, logBeta: 2, logBks: 2, eLwe: 2, eBk: 1, seed: 7, lecture: true } },
    { label: 'Multiplication by lookup (p = 32)', p: { logq: 16, p: 32, n: 4, N: 64, logBeta: 4, logBks: 4, eLwe: 2, eBk: 1, seed: 42, lecture: false } },
    { label: 'Noisy input', p: { logq: 10, p: 8, n: 6, N: 16, logBeta: 2, logBks: 2, eLwe: 30, eBk: 1, seed: 4, lecture: false } },
  ];
  const divisors = (k) => Array.from({ length: k }, (_, i) => i + 1).filter((d) => k % d === 0);
  const fields = (p) => [
    { key: 'logq', label: 'Torus q = 2^', type: 'select', options: [8, 10, 12, 14, 16], num: true, rebuild: true },
    { key: 'p', label: 'Message modulus p', type: 'select', options: [4, 8, 16, 32], num: true, hint: 'messages 0 … p/2−1' },
    { key: 'n', label: 'LWE dimension n', type: 'number', min: 1, max: 10 },
    { key: 'N', label: 'Ring degree N', type: 'select', options: [8, 16, 32, 64], num: true, hint: 'box width w = 2N/p' },
    { key: 'logBeta', label: 'Gadget base β = 2^', type: 'select', options: divisors(Number(p.logq)), num: true },
    { key: 'logBks', label: 'Key-switch base = 2^', type: 'select', options: divisors(Number(p.logq)), num: true },
    { key: 'eLwe', label: 'Fresh LWE error bound', type: 'number', min: 0, max: 500 },
    { key: 'eBk', label: 'Key error bound', type: 'number', min: 0, max: 20 },
    { key: 'seed', label: 'Random seed', type: 'number', extra: (pp, done) => h('button', { class: 'btn small', type: 'button', onclick: () => { pp.seed = Math.floor(Math.random() * 1e6); pp.lecture = false; done(); } }, 'Randomise') },
    { key: 'lecture', label: 'Use s = (1,0,1) and the Lecture 15 ciphertext for the first encryption', type: 'check' },
  ];
  function derive(p) {
    const k = Number(p.logq), q = 2 ** k, pp = Number(p.p), n = Number(p.n), N = Number(p.N), lb = Number(p.logBeta), lk = Number(p.logBks);
    if (k % lb || k % lk) return { error: 'The gadget and key-switch bases must divide log q.' }; if (2 * N < pp) return { error: 'Need 2N ≥ p so every message has a box.' }; if (q / pp < 4) return { error: 'q/p is too small to hold any noise.' };
    if (p.lecture && !(k === 10 && pp === 8 && n === 3 && N === 16)) return { error: 'The Lecture 15 instance needs q = 2^10, p = 8, n = 3, N = 16. Load the preset or untick the box.' };
    const ell = k / lb, lks = k / lk;
    return { k, q, p: pp, n, N, beta: 2 ** lb, ell, bks: 2 ** lk, lks, D: q / pp, w: (2 * N) / pp, chips: [['q', `2<sup>${k}</sup>`], ['p', pp], ['Δ = q/p', q / pp], ['n', n], ['N', N], ['w = 2N/p', (2 * N) / pp], ['β', `2<sup>${lb}</sup>`], ['ℓ', ell]],
      list: [['Δ = q/p', q / pp], ['Box width w = 2N/p', (2 * N) / pp], ['Noise budget Δ/2', q / pp / 2], ['Gadget β, ℓ', `${2 ** lb}, ${ell}`], ['Key switch base, digits', `${2 ** lk}, ${lks}`], ['BK size', `${(n * 2 * ell * 2 * N * k / 8 / 1024).toFixed(1)} KiB`]] };
  }
  function keygen(p, d) {
    const { q, n, N, ell, beta, bks, lks } = d; const rng = new RNG(Number(p.seed) || 1); const md = (x) => ((x % q) + q) % q; const cn = (x) => { x = md(x); return x > q / 2 ? x - q : x; };
    const steps = []; steps.push({ title: 'Parameters', why: 'The torus is stored as Z<sub>q</sub>. Messages are placed at Δ·m; the top half of the circle is the padding region.', node: paramChips(d.chips) });
    const s_ = p.lecture ? [1, 0, 1] : Array.from({ length: n }, () => rng.int(0, 1)); const S = Array.from({ length: N }, () => rng.int(0, 1));
    steps.push({ title: 'Sample the LWE key s and the ring key S', why: 's encrypts the data; S is the key of the accumulator inside bootstrapping. Both are binary.', formula: `s = (${s_.join(', ')}), &nbsp; S = ${polyStr(S.map(BigInt))}` });
    const pmul = (a, b) => { const r = new Array(N).fill(0); for (let i = 0; i < N; i++) { if (!a[i]) continue; for (let j = 0; j < N; j++) { const t2 = i + j; const v = a[i] * b[j]; if (t2 < N) r[t2] += v; else r[t2 - N] -= v; } } return r.map(md); };

    const glweEnc = (M) => { const A = Array.from({ length: N }, () => rng.int(0, q - 1)); const E = Array.from({ length: N }, () => rng.int(-Number(p.eBk), Number(p.eBk))); return [A, padd(padd(pmul(A, S), M), E.map(md))]; };
    const ggswEnc = (m) => { const rows = []; for (const part of [0, 1]) for (let t2 = 0; t2 < ell; t2++) { const [A, Bp] = glweEnc(new Array(N).fill(0)); const g = new Array(N).fill(0); g[0] = md(m * beta ** t2); rows.push(part === 0 ? [padd(A, g), Bp] : [A, padd(Bp, g)]); } return rows; };
    const BK = s_.map((si) => ggswEnc(si));
    steps.push({ title: 'Bootstrapping key', why: `BK<sub>i</sub> = GGSW<sub>S</sub>(s<sub>i</sub>): a ${2 * ell} × 2 matrix of GLWE encryptions of 0 plus s<sub>i</sub>·G, where G holds the gadget powers 1, β, …, β<sup>ℓ−1</sup>. There are n = ${n} of them.`, formula: `BK<sub>i</sub> = Z<sub>i</sub> + s<sub>i</sub>·G, &nbsp; size n·2ℓ·2·N = ${n * 2 * ell * 2 * N} elements of Z<sub>q</sub>` });
    const lweEnc = (mu, bound) => { const a = Array.from({ length: n }, () => rng.int(0, q - 1)); return [a, md(a.reduce((acc, x, i) => acc + x * s_[i], 0) + mu + rng.int(-bound, bound))]; };
    const KSK = S.map((Sj) => Array.from({ length: lks }, (_, t2) => lweEnc(md(Sj * bks ** t2), Number(p.eBk))));
    steps.push({ title: 'Key-switching key', why: `KSK<sub>j,t</sub> = LWE<sub>s</sub>(S<sub>j</sub>·${bks}<sup>t</sup>) for j < N, t < ${lks}: it brings the extracted ciphertext from key S back to s. Both keys rely on circular security.`, formula: `${N * lks} LWE ciphertexts of length n + 1 = ${n + 1}` });
    const ctx = { d, p, rng, s: s_, S, BK, KSK, md, cn, pmul, padd, psub, steps, encCount: 0 };
    ctx.lwePhase = (c, key) => cn(c[1] - c[0].reduce((acc, x, i) => acc + x * key[i], 0));
    ctx.glwePhase = (c) => psub(c[1], pmul(c[0], S)).map(cn);
    return ctx;
  }
  const decOf = (ctx, ct) => { const ph = ctx.lwePhase(ct.c, ctx.s); const D = ctx.d.D, pp = ctx.d.p; const m = ((Math.round(ph / D) % pp) + pp) % pp; return { phase: ph, m, noise: ctx.cn(ph - Math.round(ph / D) * D) }; };
  function ctInfo(ct, ctx) { const dd = decOf(ctx, ct); return { ok: dd.m === ct.m, chips: [[`m = ${ct.m}`], [`phase ${dd.phase}`], [`noise ${dd.noise}`, Math.abs(dd.noise) > ctx.d.D / 4 ? 'warn' : 'muted']], gauge: gauge(BigInt(Math.abs(dd.noise)), BigInt(ctx.d.D / 2), '|e|') }; }
  const tpt = (ctx, ct, cls, title) => { const ph = ctx.lwePhase(ct.c, ctx.s); return { f: ((ph % ctx.d.q) + ctx.d.q) % ctx.d.q / ctx.d.q, cls, title }; };
  function encOp(api, m) {

      { title: 'Compare with the bounds', why: `A: N<sub>d</sub> ≤ E(1 + dℓ), linear. B: N<sub>d</sub> ≤ E + ℓN<sub>d−1</sub>, exponential. With E = ${E}, ℓ = ${d.ell}, q/4 = ${d.q / 4}, chain A is guaranteed for d ≤ ${E ? lin : '∞'}. Once the noise passes q/4 it wraps modulo q, so the observed value stalls near q/2: the ciphertext is already destroyed.`,
        node: h('div', { class: 'tablewrap' }, h('table', { class: 'mini' }, h('thead', {}, h('tr', {}, h('th', {}, 'd'), h('th', {}, 'A observed'), h('th', {}, 'A bound E(1+dℓ)'), h('th', {}, 'B observed'), h('th', {}, 'decrypts (A / B)'))),
          h('tbody', {}, n1.map((v, i) => h('tr', { class: n2[i] >= d.q / 4 ? 'diff' : '' }, h('td', {}, String(i)), h('td', {}, String(v)), h('td', {}, String(E * (1 + i * d.ell))), h('td', {}, String(n2[i])), h('td', {}, `${v < d.q / 4 ? '✓' : '✗'} / ${n2[i] < d.q / 4 ? '✓' : '✗'}`)))))) },
    ];
    api.show(`Chain of ${depth} products`, steps);
  }
  const pick2 = (api, pre) => { const w = api.wallet(); return [ctSelect(api, pre + 'a', null, w[0].name), ctSelect(api, pre + 'b', null, (w[1] || w[0]).name)]; };
  const ops = [
    { id: 'enc', label: 'Encrypt', blurb: 'C = (A | Aŝ + e) + M·G: an encryption of zero plus the message times the gadget matrix.', form: (api) => { const m = h('select', { id: 'gs-m' }, h('option', { value: 1 }, '1'), h('option', { value: 0 }, '0')); return opForm(api, [{ label: 'bit M', el: m }], 'Encrypt', () => encOp(api, m.value)); } },
    { id: 'dec', label: 'Decrypt', blurb: 'v = C·s; output 0 if ‖v‖ < q/4, else 1.', form: (api) => { if (!api.wallet().length) return note('Encrypt something first.'); const a = ctSelect(api, 'gs-da', null, api.wallet()[api.wallet().length - 1].name); return opForm(api, [{ label: 'ciphertext', el: a }], 'Decrypt', () => { const ct = getCt(api, a.value); api.show(`Decrypt ${ct.name}`, decSteps(api, ct)); }); } },
    { id: 'add', label: 'EvalAdd', blurb: 'C₁ + C₂: eigenvalues and noises add. The eigenvalue is an integer sum, not XOR.', form: (api) => { if (!api.wallet().length) return note('Encrypt two bits first.'); const [a, b] = pick2(api, 'gs-a'); return opForm(api, [{ label: 'C₁', el: a }, { label: 'C₂', el: b }], 'EvalAdd', () => addOp(api, getCt(api, a.value), getCt(api, b.value))); } },
    { id: 'mul', label: 'EvalMult', blurb: 'G<sup>−1</sup>(C₁)·C₂ is AND; G − G<sup>−1</sup>(C₁)C₂ is NAND; C₁ + C₂ − 2G<sup>−1</sup>(C₁)C₂ is XOR. No evaluation key.', form: (api) => { if (!api.wallet().length) return note('Encrypt two bits first.'); const [a, b] = pick2(api, 'gs-m'); const g = h('select', { id: 'gs-g' }, ...['AND', 'NAND', 'XOR'].map((x) => h('option', { value: x }, x))); return opForm(api, [{ label: 'C₁ (decomposed)', el: a }, { label: 'C₂', el: b }, { label: 'gate', el: g }], 'Run', () => mulOp(api, getCt(api, a.value), getCt(api, b.value), g.value)); } },
    { id: 'ext', label: 'External product', tag: '→ L14, L15', blurb: 'C ⊡ c = G<sup>−1</sup>(c)·C multiplies an LWE vector c by a GSW ciphertext and returns a vector (Lecture 13, §6.3).', form: (api) => { if (!api.wallet().length) return note('Encrypt two bits first.'); const [a, b] = pick2(api, 'gs-x'); return opForm(api, [{ label: 'GSW ciphertext C', el: a }, { label: 'c = last row of', el: b }], 'C ⊡ c', () => extOp(api, getCt(api, a.value), getCt(api, b.value))); } },
    { id: 'chain', label: 'Chain', tag: 'order matters', blurb: 'Multiply by d fresh encryptions of 1 with the accumulator in each slot, and watch the noise.', form: (api) => { const dd = h('input', { id: 'gs-d', type: 'number', value: 6, min: 1, max: 40, style: 'width:5em' }); return opForm(api, [{ label: 'depth d', el: dd }], 'Run both chains', () => chainOp(api, dd.value)); } },
  ];
  return { id: 'gsw', version: 1, title: 'GSW', presets, fields, derive, ctInfo, ops, keygen,
    keyText: (c) => [`ŝ = (${c.sh.join(', ')}), &nbsp; s = (−ŝ, 1) = (${c.s.join(', ')})`, `No public or evaluation key: G is public and multiplication needs no key.`],
    run: { enc: encOp, dec: decSteps, add: addOp, mul: mulOp },
    peek(ctx, ct) { const b = bitOf(ctx, ct.C); const e = expBit(ctx, ct.M); return { got: String(b), exp: String(e), ok: b === e }; },
    intro: 'A bit is encrypted as a matrix C with C·s = M·Gs + e: an approximate eigenvector of the key. Addition adds matrices; multiplication G<sup>−1</sup>(C₁)·C₂ needs no evaluation key, and its noise grows asymmetrically. The last row is a Regev ciphertext, and the external product is the step to bootstrapping and TFHE.' };
}

// ============ Compare: one pipeline, five schemes ============
function compareDef() {
  const S = [
    { id: 'bfv', name: 'BFV', lec: 'L10', make: () => intDef('bfv'), preset: 0 },
    { id: 'bgv', name: 'BGV', lec: 'L11', make: () => intDef('bgv'), preset: 0 },
    { id: 'ckks', name: 'CKKS', lec: 'L12', make: ckksDef, preset: 0 },
    { id: 'gsw', name: 'GSW', lec: 'L13', make: gswDef, preset: 0 },
    { id: 'tfhe', name: 'TFHE', lec: 'L15', make: tfheDef, preset: 1 },
  ];
  const STATIC = {
    pt: { bfv: 'A polynomial in R<sub>t</sub>; integers are encoded in base b', bgv: 'A polynomial in R<sub>t</sub>', ckks: 'n/2 complex slots, approximate', gsw: 'One bit M ∈ {0, 1}', tfhe: 'A small integer m < p/2' },
    ct: { bfv: '(c₀, c₁) ∈ R<sub>q</sub>²', bgv: '(c₀, c₁) ∈ R<sub>q<sub>ℓ</sub></sub>², with a level ℓ', ckks: '(c₀, c₁) ∈ R<sub>q<sub>ℓ</sub></sub>², with a level and a scale', gsw: 'An ℓ × (n+1) matrix, ℓ = (n+1)·log q', tfhe: 'An LWE vector (a, b) ∈ Z<sub>q</sub><sup>n+1</sup>' },
    where: { bfv: 'c₀ + c₁·SK = Δ·M + v<br>top bits', bgv: 'c₀ + c₁·SK = M + t·v<br>low bits', ckks: 'c₀ + c₁·SK = Δ·m + e<br>noise joins the value', gsw: 'C·s = M·Gs + e<br>an eigenvalue', tfhe: 'b − ⟨a, s⟩ = Δm + e<br>torus, padding bit' },
    keys: { bfv: 'SK ternary; PK = (−(a·SK + e), a); EK<sup>(i)</sup> encrypts w<sup>i</sup>·SK²', bgv: 'As BFV, errors times t; chain q<sub>L</sub> = p₀···p<sub>L</sub>', ckks: 'As BFV; chain q<sub>ℓ</sub> = q₀·Δ<sup>ℓ</sup>', gsw: 's = (−ŝ, 1); no evaluation key', tfhe: 's ∈ {0,1}<sup>n</sup>; BK<sub>i</sub> = GGSW(s<sub>i</sub>); key-switching key' },
    enc: { bfv: 'c = (PK₀u + e₁ + Δ·M, PK₁u + e₂)', bgv: 'c = (PK₀u + t·e₁ + M, PK₁u + t·e₂)', ckks: 'm = ⌊Δ·τ⁻¹(z)⌉, then as BGV with t = 1', gsw: 'C = (A | Aŝ + e) + M·G', tfhe: 'b = ⟨a, s⟩ + Δm + e' },
    add: { bfv: 'c + c′ part by part; noises add', bgv: 'c + c′ part by part; noises add', ckks: 'c + c′; slots add, scale unchanged', gsw: 'C₁ + C₂; eigenvalue M₁ + M₂ (an integer sum)', tfhe: 'c₁ + c₂; phases add, no bootstrapping' },
    mul: { bfv: 'Tensor over Z, scale by t/q, round; 3 parts', bgv: 'Tensor mod q<sub>ℓ</sub>; 3 parts', ckks: 'Tensor; scale becomes Δ²; 3 parts', gsw: 'G<sup>−1</sup>(C₁)·C₂; noise ≤ ‖e₁‖ + ℓ‖e₂‖', tfhe: 'No direct product: 2<sup>k</sup>c<sub>x</sub> + c<sub>y</sub>, then a table x·y' },
    ctl: { bfv: 'Relinearize: back to 2 parts', bgv: 'Relinearize, then ModSwitch: drop a prime', ckks: 'Relinearize, then Rescale: ÷Δ, drop a level', gsw: 'None needed; keep the accumulator in the decomposed slot', tfhe: 'Bootstrap: resets the noise (identity table on the sum)' },
    dec: { bfv: '[⌊(t/q)·[c₀ + c₁·SK]<sub>q</sub>⌉]<sub>t</sub>', bgv: '[[c₀ + c₁·SK]<sub>q<sub>ℓ</sub></sub>]<sub>t</sub>', ckks: 'Decode [c₀ + c₁·SK]<sub>q<sub>ℓ</sub></sub> at scale Δ', gsw: '‖C·s‖ < q/4 ? 0 : 1', tfhe: '⌊(b − ⟨a, s⟩)/Δ⌉ mod p' },
  };
  const ROWS = [
    { id: 'pt', label: 'Plaintext' }, { id: 'ct', label: 'Ciphertext' }, { id: 'where', label: 'Where M sits' },
    { id: 'keys', label: 'Key generation', live: true }, { id: 'enc', label: 'Encrypt m₁, m₂', live: true }, { id: 'add', label: 'EvalAdd', live: true },
    { id: 'mul', label: 'EvalMult', live: true }, { id: 'ctl', label: 'Noise control', live: true }, { id: 'dec', label: 'Decrypt the product', live: true },
  ];
  const st = store.get('lab2.cmp', { m1: 3, m2: 1, on: S.map((x) => x.id) });
  let results = {}, detail = null;
  const root = h('div', { class: 'page cmp', id: 'page-compare' });

  function headless(sc) {
    const def = sc.make(); const p = { ...def.presets[sc.preset].p }; const d = def.derive(p); if (d.error) throw new Error(d.error);
    const ctx = def.keygen(p, d); ctx.p = ctx.p || p; const wallet = []; let last = null;
    const api = { get p() { return p; }, get ctx() { return ctx; }, wallet: () => wallet, addCt(ct) { wallet.push(ct); }, nextName(pre) { let i = 1; while (wallet.some((c) => c.name === pre + i)) i++; return pre + i; }, show(title, steps) { last = { title, steps }; }, refresh() {} };
    const take = () => { const r = last; last = null; return r; }; const top = () => wallet[wallet.length - 1];
    return { def, p, d, ctx, api, take, top };
  }
  function runScheme(sc, m1, m2) {
    const H = headless(sc); const { def, api, ctx, take, top } = H; const R = def.run; const out = {};
    const cell = (ct, shown, extra) => ({ ct, info: ct ? def.ctInfo(ct, ctx) : null, peek: ct && def.peek ? def.peek(ctx, ct) : null, steps: shown ? shown.steps : null, title: shown ? shown.title : '', extra });
    out.keys = { steps: ctx.steps, title: 'Key generation', keyText: def.keyText ? def.keyText(ctx) : (ctx.SK ? [`SK = ${polyStr(ctx.SK)}`, `${ctx.EK.length} evaluation keys (base w)`] : [`s = (${ctx.s.join(', ')})`, `BK: ${ctx.d.n} GGSW ciphertexts; KSK: ${ctx.d.N * ctx.d.lks} LWE ciphertexts`]) };
    let x1 = m1, x2 = m2, note1 = '';
    if (sc.id === 'gsw') { x1 = m1 % 2; x2 = m2 % 2; note1 = `bits m₁ mod 2 = ${x1}, m₂ mod 2 = ${x2}`; }
    if (sc.id === 'ckks') note1 = 'slot 0 shown';
    R.enc(api, String(x1)); const e1 = take(); const c1 = top(); R.enc(api, String(x2)); const e2 = take(); const c2 = top();
    out.enc = { ...cell(c1, e1), second: cell(c2, e2), extra: note1 };
    let sum, prod, ctl;
    if (sc.id === 'tfhe') {
      const r = R.lin(api, c1, c2, 1, 1, 0, 'sum'); sum = r.ct; out.add = cell(sum, { title: `EvalAdd ${c1.name} + ${c2.name}`, steps: r.steps });
      const d = ctx.d; const kb = Math.floor(Math.log2(d.p / 2) / 2); const K = 2 ** kb;
      if (x1 >= K || x2 >= K) { out.mul = { error: `TFHE multiplies by lookup with x, y < ${K} at p = ${d.p}.` }; }
      else { const rp = R.lin(api, c1, c2, K, 1, 0, 'pack'); const lut = Array.from({ length: d.p / 2 }, (_, s2) => ((Math.floor(s2 / K) * (s2 % K)) % K)); const steps = R.pbs(api, rp.ct, lut, `${c1.name} × ${c2.name}`, [...rp.steps, { title: 'The product table', why: `Index ${K}x + y ↦ x·y mod ${K}.`, formula: `f = (${lut.join(', ')})` }]); prod = top(); out.mul = cell(prod, { title: `EvalMult ${c1.name} × ${c2.name} by lookup`, steps }, `product mod ${K}`); }
      const st2 = R.pbs(api, sum, Array.from({ length: ctx.d.p / 2 }, (_, i) => i), `Refresh(${sum.name})`); ctl = top(); out.ctl = cell(ctl, { title: `Bootstrap ${sum.name} (identity table)`, steps: st2 }, 'the sum, refreshed');
    } else {
      R.add(api, c1, c2); out.add = cell(top(), take()); sum = top();
      R.mul(api, c1, c2); const ms = take(); prod = top(); out.mul = cell(prod, ms, sc.id === 'gsw' ? 'AND' : '');
      if (sc.id === 'gsw') { R.mul(api, c2, c1); const sw = take(); ctl = top(); out.ctl = cell(ctl, sw, `other order: G⁻¹(${c2.name})·${c1.name}`); }
      else {
        R.relin(api, prod, 'gadget'); const rl = take(); let fin = top(); let steps = rl.steps, title = rl.title;
        if (sc.id === 'bgv' && fin.lvl > 0) { R.ms(api, fin); const m2s = take(); fin = top(); steps = [...steps, ...m2s.steps]; title += ' + ModSwitch'; }
        if (sc.id === 'ckks' && fin.lvl > 0) { R.rescale(api, fin); const rs = take(); fin = top(); steps = [...steps, ...rs.steps]; title += ' + Rescale'; }
        ctl = fin; out.ctl = cell(ctl, { title, steps }); prod = fin;
      }
    }
    if (prod) out.dec = { ...cell(prod, { title: `Decrypt ${prod.name}`, steps: R.dec(api, prod) }) };
    else out.dec = { error: 'No product to decrypt.' };
    return out;
  }
  function runAll() {
    results = {}; detail = null;
    for (const sc of S) { if (!st.on.includes(sc.id)) continue; try { results[sc.id] = runScheme(sc, st.m1, st.m2); } catch (e) { results[sc.id] = { fatal: e.message }; } }
    render();
  }
  function liveNode(sc, row) {
    const R = results[sc.id]; if (!R) return null; if (R.fatal) return note(R.fatal, 'warnnote'); const c = R[row]; if (!c) return null; if (c.error) return note(c.error, 'warnnote');
    const box = h('div', { class: 'live' });
    const ctLine = (cc) => { if (!cc || !cc.ct) return null; const pk = cc.peek; return h('div', { class: 'livect' }, h('div', { class: 'wtop' }, h('span', { class: 'cname mono' }, cc.ct.name), pk ? h('span', { class: 'chip ' + (pk.ok ? 'ok' : 'bad'), html: `→ ${pk.got}${pk.ok ? '' : ` (expected ${pk.exp})`}` }) : null), h('div', { class: 'wchips' }, ...cc.info.chips.filter((x, i) => i < 3 || /bits/.test(x[0])).map((x) => chip(x[0], x[1] || 'muted'))), cc.info.gauge || null); };
    if (row === 'keys') box.append(h('p', { class: 'mono small', html: c.keyText[0] }), h('p', { class: 'small', html: c.keyText[1] }));
    else { box.append(ctLine(c)); if (c.second) box.append(ctLine(c.second)); if (c.extra) box.append(h('p', { class: 'hint', html: c.extra })); }
    const steps = c.steps; if (steps && steps.length) box.append(h('button', { class: 'btn small ghost', type: 'button', onclick: () => { detail = { sc, row, title: c.title, steps }; render(); setTimeout(() => { const el = $('#cmp-detail'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 30); } }, `Steps (${steps.length}) ▸`));
    if (c.second && c.second.steps) box.append(h('button', { class: 'btn small ghost', type: 'button', onclick: () => { detail = { sc, row, title: c.second.title, steps: c.second.steps }; render(); setTimeout(() => { const el = $('#cmp-detail'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 30); } }, `Second encryption ▸`));
    return box;
  }
  function render() {
    root.innerHTML = ''; const main = h('div', { class: 'main' }); root.append(main);
    main.append(h('div', { class: 'lede' }, h('h2', {}, 'Compare'), h('p', { html: 'The same pipeline in every scheme, side by side: generate keys, encrypt m₁ and m₂, add, multiply, control the noise, decrypt. Each column uses that scheme\'s first preset (TFHE: p = 32, so products work). Click <b>Steps</b> in any cell to replay that operation.' })));
    const m1 = h('input', { id: 'cmp-m1', type: 'number', min: 0, max: 3, value: st.m1, style: 'width:5em' }), m2 = h('input', { id: 'cmp-m2', type: 'number', min: 0, max: 3, value: st.m2, style: 'width:5em' });
    const boxes = S.map((sc) => h('label', { class: 'check', style: `--accent: var(--${sc.id})` }, h('input', { type: 'checkbox', checked: st.on.includes(sc.id), onchange: (e) => { st.on = e.target.checked ? [...st.on, sc.id] : st.on.filter((x) => x !== sc.id); store.set('lab2.cmp', st); render(); } }), h('span', {}, sc.name)));
    main.append(h('section', { class: 'card' }, h('div', { class: 'opform' }, h('label', { class: 'opfield' }, h('span', {}, 'm₁ (0–3)'), m1), h('label', { class: 'opfield' }, h('span', {}, 'm₂ (0–3)'), m2),
      h('button', { class: 'btn primary', type: 'button', id: 'cmp-run', onclick: () => { const a = Number(m1.value), b = Number(m2.value); if (![a, b].every((x) => Number.isInteger(x) && x >= 0 && x <= 3)) { flash('Use integers 0 to 3, so every scheme can multiply them.'); return; } st.m1 = a; st.m2 = b; store.set('lab2.cmp', st); runAll(); } }, 'Run all schemes')),
      h('div', { class: 'row wrap' }, h('span', { class: 'hint' }, 'Show:'), ...boxes),
      note(`Expected: m₁ + m₂ = ${st.m1 + st.m2}, m₁·m₂ = ${st.m1 * st.m2}. GSW works on bits (m mod 2); TFHE multiplies modulo 4 by lookup.`)));
    const cols = S.filter((sc) => st.on.includes(sc.id));
    if (!cols.length) { main.append(note('Choose at least one scheme.')); return; }
    const tbl = h('table', { class: 'cmpt' }, h('thead', {}, h('tr', {}, h('th', {}, ''), ...cols.map((sc) => h('th', { style: `--accent: var(--${sc.id})` }, h('a', { href: '#' + sc.id }, sc.name), h('span', { class: 'sub' }, ' ' + sc.lec))))));
    const tb = h('tbody');
    for (const r of ROWS) tb.append(h('tr', { class: r.live ? 'liverow' : 'staticrow' }, h('th', {}, r.label), ...cols.map((sc) => h('td', { style: `--accent: var(--${sc.id})` }, h('div', { class: 'formula small', html: STATIC[r.id][sc.id] }), r.live ? liveNode(sc, r.id) : null))));
    tbl.append(tb); main.append(h('section', { class: 'card' }, h('div', { class: 'tablewrap cmpwrap' }, tbl)));
    if (detail) main.append(h('section', { class: 'card vizcard', id: 'cmp-detail', style: `--accent: var(--${detail.sc.id})` }, h('div', { class: 'chead' }, h('h4', {}, `${detail.sc.name}: ${detail.title}`), h('button', { class: 'btn small ghost', type: 'button', onclick: () => { detail = null; render(); } }, 'Close')), stepper(detail.steps)));
  }
  return { root, start() { runAll(); } };
}

// ========== shell ==========
const DEFS = { bfv: () => intDef('bfv'), bgv: () => intDef('bgv'), ckks: ckksDef, gsw: gswDef, tfhe: tfheDef, compare: null };
const built = {};
function route() {
  let id = (location.hash || '').replace('#', ''); if (!(id in DEFS)) id = store.get('lab2.tab', 'bfv'); if (!(id in DEFS)) id = 'bfv'; store.set('lab2.tab', id);
  document.querySelectorAll('.tabs a').forEach((a) => a.setAttribute('aria-current', a.dataset.id === id ? 'page' : 'false')); document.documentElement.dataset.scheme = id;
  for (const k in built) built[k].root.hidden = k !== id;
  if (!built[id]) { built[id] = id === 'compare' ? compareDef() : makeLab(DEFS[id]()); $('#host').append(built[id].root); built[id].start(); }
}
window.addEventListener('hashchange', route);
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', route); else route();
