<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PQC Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a lab bench. Sticky parameter rail on the left, a vertical stack of step cards on the right; one hue per scheme. */
:root {
  --paper: #f4f6f8; --panel: #ffffff; --ink: #18202b; --muted: #5b6676; --line: #d9dee5; --soft: #eaeef2;
  --lattice: #3a48a3; --code: #0f766e; --hash: #a1600f; --multivariate: #8b3a86; --isogeny: #a33a55; --overview: #3d4a5c;
  --accent: var(--bfv); --accent-soft: #e6e9f7;
  --ok: #2e7d4a; --ok-soft: #e3f2e8; --bad: #b8382f; --bad-soft: #f9e3e1; --warn: #a66a00; --warn-soft: #fbf0d9;
  --band1: #eef1f6; --band2: #e2e7f0;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #11161d; --panel: #18202a; --ink: #e6ebf1; --muted: #9aa6b5; --line: #2b3542; --soft: #1f2833;
  --lattice: #8f9cf0; --code: #4fc2b4; --hash: #e2a24f; --multivariate: #d78ad1; --isogeny: #ee8aa3; --overview: #a9b8cc; --accent-soft: #232b45;
  --ok: #6fcf8f; --ok-soft: #173325; --bad: #f08a80; --bad-soft: #3a1f1d; --warn: #e8b85a; --warn-soft: #3a2f17;
  --band1: #1d2530; --band2: #253041; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #11161d; --panel: #18202a; --ink: #e6ebf1; --muted: #9aa6b5; --line: #2b3542; --soft: #1f2833;
  --lattice: #8f9cf0; --code: #4fc2b4; --hash: #e2a24f; --multivariate: #d78ad1; --isogeny: #ee8aa3; --overview: #a9b8cc; --accent-soft: #232b45;
  --ok: #6fcf8f; --ok-soft: #173325; --bad: #f08a80; --bad-soft: #3a1f1d; --warn: #e8b85a; --warn-soft: #3a2f17;
  --band1: #1d2530; --band2: #253041; color-scheme: dark; }
:root[data-fam="lattice"] { --accent: var(--lattice); } :root[data-fam="code"] { --accent: var(--code); }
:root[data-fam="hash"] { --accent: var(--hash); } :root[data-fam="multivariate"] { --accent: var(--multivariate); }
:root[data-fam="isogeny"] { --accent: var(--isogeny); } :root[data-fam="overview"] { --accent: var(--overview); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-body); }
.mono, code, td.mono { font-family: var(--f-mono); font-size: 0.86em; font-variant-numeric: tabular-nums; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.topin { max-width: 1320px; margin: 0 auto; padding: 10px 20px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.brand { font: 700 19px/1 var(--f-display); letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 10px; }
.brand small { font: 400 13px var(--f-body); color: var(--muted); }
.backlink { font: 600 13px var(--f-body); color: var(--muted); text-decoration: none; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
.backlink:hover, .backlink:focus-visible { color: var(--ink); border-color: var(--muted); }
@media (max-width: 1300px) and (min-width: 901px) { .brand small { display: none; } }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.tabs a { text-decoration: none; color: var(--muted); font: 600 14px var(--f-body); padding: 7px 14px; border-radius: 999px; border: 1px solid transparent; }
.tabs a:hover { color: var(--ink); border-color: var(--line); }
.tabs a[aria-current="page"] { color: var(--panel); background: var(--accent); }
.tabs a .sub { font-weight: 400; opacity: .8; margin-left: 4px; font-size: 12px; }
#host { max-width: 1320px; margin: 0 auto; padding: 18px 20px 60px; }
.page { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); max-height: calc(100vh - 80px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.side h3 { margin: 0; font: 700 15px var(--f-display); letter-spacing: .02em; text-transform: uppercase; color: var(--accent); }
.side h4 { margin: 4px 0; font: 600 13px var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field.span2, .fgrid .field:has(input[id$="primes"]), .fgrid .field:has(input[id$="-m1"]), .fgrid .field:has(input[id$="-m2"]), .fgrid .field:has(input[id^="ck-z"]) { grid-column: span 2; }
.flabel { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); }
input, select { font: 14px var(--f-mono); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; width: 100%; }
.row input, .builder input, .builder select { width: auto; }
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 6px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; }
.check input { width: auto; margin-top: 3px; }
.btn { font: 600 13.5px var(--f-body); border-radius: 7px; padding: 7px 13px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.small { padding: 4px 9px; font-size: 12.5px; }

.fgrid .span2 { grid-column: span 2; }
.derived { border-top: 1px dashed var(--line); padding-top: 10px; }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; font-family: var(--f-mono); font-size: 12.5px; text-align: right; overflow-wrap: anywhere; }
dl.kv.wide dd { text-align: left; }
.main { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.lede h2 { margin: 2px 0 4px; font: 700 34px/1.05 var(--f-display); letter-spacing: -0.02em; color: var(--accent); }
.lede p { margin: 0; max-width: 72ch; color: var(--ink); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.keys { border-left: 4px solid var(--accent); }
.card.error { border-color: var(--bad); background: var(--bad-soft); }
.card.error p { margin: 0; }
.chead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.chead h4 { margin: 0; font: 700 17px var(--f-display); }
.chead h5, .card h5 { margin: 6px 0 0; font: 700 14px var(--f-display); color: var(--accent); }
.cname { background: var(--accent-soft); color: var(--accent); padding: 1px 8px; border-radius: 5px; font-weight: 600; }
.operands { color: var(--muted); }
.chip { font: 600 11.5px var(--f-body); padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); letter-spacing: .02em; }
.chip.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.chip.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
.chip.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.formula { font-family: var(--f-mono); font-size: 13px; background: var(--soft); border-radius: 6px; padding: 7px 10px; overflow-x: auto; }
.summary { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 14px; align-items: center; }
.res { display: flex; flex-direction: column; gap: 2px; padding: 9px 12px; border-radius: 8px; min-width: 0; }
.res.ok { background: var(--ok-soft); } .res.bad { background: var(--bad-soft); } .res.warnres { background: var(--warn-soft); }
.res .big { font: 700 15px var(--f-display); }
.res.ok .big { color: var(--ok); } .res.bad .big { color: var(--bad); } .res.warnres .big { color: var(--warn); }
.res .mono { overflow-wrap: anywhere; }
.gauge { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.gbar { position: relative; height: 12px; background: var(--soft); border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.gfill { height: 100%; background: var(--ok); transition: width .35s ease; }
.gauge.warn .gfill { background: var(--warn); } .gauge.bad .gfill { background: var(--bad); width: 100% !important; }
.gtext { font-size: 13px; color: var(--muted); } .gtext b { color: var(--ink); }
.gauge.broken .gtext { color: var(--bad); font-weight: 600; }
details.steps { border-top: 1px solid var(--line); padding-top: 6px; }
details.steps > summary { cursor: pointer; font-weight: 600; color: var(--accent); font-size: 14px; list-style: none; }
details.steps > summary::before { content: "▸ "; } details.steps[open] > summary::before { content: "▾ "; }
.stepbody { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; min-width: 0; }
.tablewrap { overflow-x: auto; max-width: 100%; }
table.ptab { border-collapse: collapse; font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
table.ptab th, table.ptab td { padding: 2px 8px; text-align: right; white-space: nowrap; }
table.ptab thead th { color: var(--muted); font-weight: 400; border-bottom: 1px solid var(--line); }
table.ptab tbody th { text-align: left; font-family: var(--f-body); font-size: 12.5px; font-weight: 600; color: var(--muted); padding-right: 14px; }
table.ptab tr.hl td { background: var(--accent-soft); font-weight: 600; }
table.ptab tr.sep td { height: 6px; border-bottom: 1px dashed var(--line); padding: 0; }
table.ptab td.bad { color: var(--bad); font-weight: 700; }
table.ptab.compact td { padding: 1px 6px; }
table.mini { border-collapse: collapse; font-size: 12.5px; }
table.mini th, table.mini td { padding: 3px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.mini th { color: var(--muted); font-weight: 600; text-align: right; }
table.mini tbody th { text-align: left; }
table.mini tr.diff td { background: var(--warn-soft); }
.note { margin: 0; font-size: 13.5px; color: var(--muted); max-width: 80ch; }
.note b { color: var(--ink); }
.note.warnnote { color: var(--warn); font-weight: 600; }
.builder { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--panel); border: 1px dashed var(--accent); border-radius: 10px; padding: 10px 12px; }
.builder.flat { border-style: solid; border-color: var(--line); background: var(--soft); font-family: var(--f-mono); }
.blabel { font: 700 13px var(--f-display); color: var(--accent); text-transform: uppercase; letter-spacing: .05em; margin-right: 4px; }
.opfield { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
.cards { display: flex; flex-direction: column; gap: 14px; }
.cfoot { display: flex; justify-content: flex-end; gap: 10px; align-items: center; }
.fig { margin: 0; min-width: 0; }
.fig figcaption { font-size: 12.5px; color: var(--muted); margin-top: 4px; max-width: 90ch; }
svg.viz { width: 100%; height: auto; display: block; }
svg.viz .lbl { fill: var(--muted); font: 11px var(--f-mono); }
svg.viz .band1 { fill: var(--band1); } svg.viz .band2 { fill: var(--band2); }
svg.viz .axis { stroke: var(--muted); stroke-width: 1; } svg.viz .grid { stroke: var(--line); stroke-width: 1; }
svg.viz .dot.ok { fill: var(--accent); stroke: var(--panel); stroke-width: 1.5; } svg.viz .dot.bad { fill: var(--bad); stroke: var(--panel); stroke-width: 1.5; }
svg.viz .target { fill: var(--ink); opacity: .55; }
svg.viz .noiseline { stroke: var(--accent); stroke-width: 2; opacity: .55; }
svg.viz .noisebar { stroke: var(--accent); stroke-width: 6; opacity: .35; stroke-linecap: round; }
svg.viz .barE { fill: var(--muted); opacity: .55; } svg.viz .barD { fill: var(--accent); } svg.viz .barN { fill: var(--warn); }
svg.viz .box0 { fill: var(--accent); } svg.viz .box1 { fill: var(--accent); opacity: .55; }
svg.viz .hi { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 3 2; }
svg.viz .budget { stroke: var(--bad); stroke-dasharray: 4 3; } svg.viz .trace { fill: none; stroke: var(--accent); stroke-width: 2; } svg.viz .tracept { fill: var(--accent); }
svg.torus { max-width: 260px; }
svg.torus .sec1 { fill: var(--band1); stroke: var(--line); } svg.torus .sec2 { fill: var(--band2); stroke: var(--line); }
svg.torus .pad { fill: var(--warn-soft); }
svg.torus .rim { fill: none; stroke: var(--muted); }
svg.torus .hand { stroke-width: 2; stroke: var(--muted); }
svg.torus .dot.c1 { fill: var(--muted); } svg.torus .dot.c2 { fill: var(--warn); } svg.torus .dot.comb { fill: var(--accent); }
.key { display: inline-block; width: 11px; height: 11px; border-radius: 2px; vertical-align: -1px; } .keyE { background: var(--muted); opacity: .55; } .keyD { background: var(--accent); }
.two { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: center; }
.lut { display: flex; flex-wrap: wrap; gap: 8px; }
.lutcell { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--soft); }
.lutin { font: 12px var(--f-mono); color: var(--muted); }
.lutbtn { font: 700 18px var(--f-mono); width: 2.2em; border: 1px solid var(--accent); background: var(--panel); color: var(--accent); border-radius: 6px; cursor: pointer; padding: 2px 0; }
.lutbtn:hover { background: var(--accent-soft); }
.stepper input[type=range] { width: min(320px, 100%); accent-color: var(--accent); }
.rotbox { display: flex; flex-direction: column; gap: 6px; min-height: 180px; }
#flash { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 9; }

/* guided workflow */
.btn.big { padding: 11px 16px; font-size: 15px; width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { display: inline-flex; align-items: baseline; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 3px 9px; }
.pchip .pk { font-size: 12px; color: var(--muted); font-weight: 600; } .pchip .pv { font-size: 12.5px; }
.opsbar { display: flex; flex-wrap: wrap; gap: 6px; }
.opbtn { display: inline-flex; align-items: center; gap: 8px; font: 600 14px var(--f-body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 8px 13px; cursor: pointer; }
.opbtn:hover:not(:disabled) { border-color: var(--accent); }
.opbtn.on { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.opbtn:disabled { opacity: .45; cursor: not-allowed; }
.opn { font: 700 11px var(--f-mono); width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.opbtn.on .opn { background: var(--panel); color: var(--accent); }
.oppanel { border-left: 4px solid var(--accent); }
.opform { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.opform .opfield { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.opform input, .opform select { width: auto; min-width: 7em; }
.why { margin: 0; max-width: 78ch; }
.card.empty { align-items: flex-start; border-style: dashed; }
.card.empty p { margin: 0; max-width: 70ch; }
.wlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.wct { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; display: flex; flex-direction: column; gap: 6px; background: var(--paper); min-width: 0; }
.wct.badct { border-color: var(--bad); }
.wtop { display: flex; gap: 8px; align-items: baseline; min-width: 0; } .wdesc { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.wchips { display: flex; flex-wrap: wrap; gap: 4px; }
.wct .gtext { font-size: 12px; }
.vizcard { border-top: 4px solid var(--accent); }
.stepper { display: flex; flex-direction: column; gap: 12px; }
.stepctl { display: flex; flex-direction: column; gap: 8px; }
.dots { display: flex; flex-wrap: wrap; gap: 5px; }
.dots .dot { font: 600 11.5px var(--f-mono); min-width: 28px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; }
.dots .dot.done { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.dots .dot.on { background: var(--accent); color: var(--panel); border-color: var(--accent); }
.stepbody { display: flex; flex-direction: column; gap: 14px; }
.step { display: flex; flex-direction: column; gap: 9px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); min-width: 0; }
.stephead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.stepno { font: 600 11.5px var(--f-mono); color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
.stephead h5 { margin: 0; font: 700 16px var(--f-display); color: var(--ink); }
.stepres { display: grid; grid-template-columns: minmax(220px, 320px) minmax(0, 1fr); gap: 14px; align-items: center; }
table.ptab tr.new td, table.ptab tr.new th { background: var(--warn-soft); }
table.ptab td.clk { text-decoration: underline dotted var(--accent); text-underline-offset: 3px; cursor: pointer; }
table.ptab td.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.explain { font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; overflow-x: auto; }
.explain .mono { display: block; margin-top: 4px; white-space: normal; overflow-wrap: anywhere; }
.ptwrap { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
/* GSW and compare */
table.ptab td.mk { background: var(--warn-soft); font-weight: 700; }
svg.viz .trace2 { fill: none; stroke: var(--warn); stroke-width: 2; stroke-dasharray: 5 3; } svg.viz .tracept2 { fill: var(--warn); }
.keyN { background: var(--warn); }
.page.cmp { grid-template-columns: minmax(0, 1fr); }
.cmpwrap { overflow-x: auto; }
table.cmpt { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1060px; table-layout: fixed; }
table.cmpt th, table.cmpt td { vertical-align: top; padding: 8px; border-bottom: 1px solid var(--line); text-align: left; }
table.cmpt thead th { font: 700 17px var(--f-display); color: var(--accent); border-bottom: 3px solid var(--accent); position: sticky; top: 0; background: var(--panel); }
table.cmpt thead th a { color: inherit; text-decoration: none; } table.cmpt thead th .sub { font: 400 12px var(--f-body); color: var(--muted); }
table.cmpt thead th:first-child, table.cmpt tbody th { width: 112px; }
table.cmpt tbody th { font: 600 13px var(--f-body); color: var(--muted); }
table.cmpt tr.staticrow td .formula { background: transparent; padding: 0; font-family: var(--f-body); font-size: 13px; }
table.cmpt .formula.small { font-size: 12px; white-space: normal; }
table.cmpt td .live { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
table.cmpt .livect { border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; background: var(--paper); }
table.cmpt .gtext { font-size: 11.5px; }
p.small, .small { font-size: 12.5px; margin: 0; overflow-wrap: anywhere; }
@media (max-width: 900px) { .stepres { grid-template-columns: minmax(0, 1fr); } .page > .side { order: -1; } }

// ===== FHE core: BigInt ring arithmetic + BFV, BGV, CKKS, TFHE =====

    for (const [lo, hi] of pieces) { svg.append(s('rect', { x: x(lo), y: top - 4, width: x(hi) - x(lo), height: n * rowH + 6, class: k % 2 ? 'band2' : 'band1' })); if (x(hi) - x(lo) > 22) svg.append(s('text', { x: (x(lo) + x(hi)) / 2, y: 14, class: 'lbl', 'text-anchor': 'middle' }, opts.lab ? opts.lab(k) : String(k))); }
  }
  const ticks = opts.ticks || [[0, '0'], [q / 4, 'q/4'], [q / 2, 'q/2'], [(3 * q) / 4, '3q/4'], [q, 'q']];
  for (const [t, l] of ticks) { svg.append(s('line', { x1: x(t), x2: x(t), y1: top - 4, y2: top + n * rowH + 4, class: 'grid' })); svg.append(s('text', { x: x(t), y: Hh - 4, class: 'lbl', 'text-anchor': 'middle' }, l)); }
  vals.forEach((v, i) => {
    const yy = top + i * rowH + rowH / 2; svg.append(s('text', { x: 4, y: yy + 4, class: 'lbl' }, opts.rl ? opts.rl(i) : (i === 0 ? '1' : `X${i}`)));
    const dec = lk_round(v, q, L); const ok = !exp || dec === exp[i];
    if (exp) { let tx = exp[i] * w; if (exp[i] === 0 && v > q / 2) tx = q; svg.append(s('line', { x1: x(tx), x2: x(v), y1: yy, y2: yy, class: 'noiseline' })); svg.append(s('circle', { cx: x(tx), cy: yy, r: 2.5, class: 'target' })); }
    svg.append(s('circle', { cx: x(v), cy: yy, r: 4.5, class: ok ? 'dot ok' : 'dot bad' }, s('title', {}, `${v} → ${dec}`)));

}
// histogram with ± bound
function lk_hist(vals, bound, caption, blabel = 'q/4') {

  svg.append(s('line', { x1: padL, x2: W - padL, y1: H - padB, y2: H - padB, class: 'axis' }));
  if (zoom) { for (const sg of [-1, 1]) svg.append(s('text', { x: sg < 0 ? padL + 2 : W - padL - 2, y: top + 10, class: 'lbl', 'text-anchor': sg < 0 ? 'start' : 'end' }, sg < 0 ? `← −${blabel} = −${Math.floor(bound)} (off scale)` : `+${blabel} = ${Math.floor(bound)} (off scale) →`)); for (const t of [-Math.round(R * 0.8), Math.round(R * 0.8)]) svg.append(s('text', { x: x(t), y: H - 6, class: 'lbl', 'text-anchor': 'middle' }, String(t))); }
  for (const b of zoom ? [0] : [-bound, 0, bound]) { svg.append(s('line', { x1: x(b), x2: x(b), y1: top, y2: H - padB, class: b ? 'budget' : 'grid' })); svg.append(s('text', { x: x(b), y: H - 6, class: 'lbl', 'text-anchor': 'middle' }, b ? (b < 0 ? '−' : '+') + blabel : '0')); }
  return h('figure', { class: 'fig' }, svg, h('figcaption', { html: caption + (zoom ? ' The axis is zoomed in: the bound is far outside the plotted range.' : '') }));
}

// ---------- generic Fujisaki–Okamoto KEM layer on top of a deterministic CPA scheme ----------
// S: { enc(ctx, m, coins, pre) -> {c, steps}, dec(ctx, c, truth, pre) -> {m, ok, steps, noise, bound}, ser(c), eq(c, c2), cmp(c2, c) -> step part, mlen(ctx) }
function lk_kem(S) {

  const KDF = (x, c) => { const hc = H('H', S.ser(c)); return { hc, K: H('KDF', x, hc) }; };

    const steps = []; const g = G(ctx, m);
    steps.push({ title: 'Choose a random message m', why: `m is ${m.length} random bits (32 bytes in the real scheme). It is not the key: the key is derived from it by hashing, so it can be recovered by decryption and checked.`, formula: `m = ${lk_bstr(m)}<br>H(pk) = ${hexShort(ctx.hpk, 8)}`, node: () => lk_bits(m, { caption: 'random m' }) });
    steps.push({ title: '(K̄, r) = G(m ‖ H(pk))', why: 'G derives both a pre-key K̄ and the encryption coins r from m. Including H(pk) binds the result to this public key.', formula: `K̄ = ${hex(g.Kbar, 12)}…<br>r = ${hex(g.coins, 12)}… &nbsp;(coins for Enc)`, node: () => note('G, H and KDF here are SHA-256 (pqc-core): G in counter mode for 64 bytes. The standard uses SHA3-512, SHA3-256 and SHAKE-256.') });
    const E = S.enc(ctx, m, g.coins, 'Enc · '); steps.push(...E.steps);
    const kd = KDF(g.Kbar, E.c);
    steps.push({ title: 'K = KDF(K̄ ‖ H(c))', why: 'The shared key depends on the whole ciphertext. This is the Kyber round-3 form; FIPS 203 takes K directly from G and hashes c only on rejection, with the same security argument.', formula: `H(c) = ${hex(kd.hc, 12)}…<br>K = ${hex(kd.K, 16)}…`, node: lk_res(true, `Shared key K = ${hexShort(kd.K, 8)}`, 'Send c to the key owner; keep K.') });
    return { E, c: E.c, K: kd.K, m, steps };
  }

    const steps = []; const c = item.c;
    const D = S.dec(ctx, c, item.tampered ? { m: item.m } : item.E, 'Dec · '); steps.push(...D.steps);
    const g = G(ctx, D.m);
    steps.push({ title: '(K̄′, r′) = G(m′ ‖ H(pk))', why: 'Recompute what an honest sender holding m′ would have derived. The secret key stores pk and H(pk) for this.', formula: `m′ = ${lk_bstr(D.m)}<br>K̄′ = ${hex(g.Kbar, 12)}…<br>r′ = ${hex(g.coins, 12)}…` });

    steps.push({ title: 'Re-encrypt: c′ = Enc(pk, m′; r′)', why: `Encryption is deterministic given the coins, so an honest c is reproduced exactly. Any change to c shows up here, even one that still decrypts to the same m′. ${eq ? 'Here c′ = c.' : 'Highlighted entries differ.'}`, ...S.cmp(E2.c, c) });

    steps.push({ title: eq ? 'c′ = c: accept, K = KDF(K̄′ ‖ H(c))' : 'c′ ≠ c: implicit rejection, K = KDF(z ‖ H(c))',
      why: eq ? 'The ciphertext is exactly what an honest sender produces, so the pre-key K̄′ is used.' : 'No error is reported. The output is a pseudorandom key derived from the secret z, so a chosen-ciphertext attacker learns nothing from the failure, not even that it happened.',
      formula: `K = ${hex(kd.K, 16)}…<br>sender’s K = ${hex(item.K, 16)}…`,
      node: lk_res(item.tampered ? !same : same, same ? 'Keys match' : 'Keys differ', same ? 'Both sides now hold the same 32-byte key.' : item.tampered ? 'Expected: the ciphertext was modified, so the receiver’s key is unrelated to the sender’s.' : 'Decryption failed (noise too large), so re-encryption did not match.') });

// shared KEM ops / ctInfo
function lk_kemOps(id, S, KEM, extra) {

    { id: 'encaps', label: 'Encaps', tag: 'FO', blurb: 'm random; (K̄, r) = G(m ‖ H(pk)); c = Enc(pk, m; r); K = KDF(K̄ ‖ H(c)).', form: (api) => opForm(api, [], 'Encapsulate', () => encapsOp(api)) },
    { id: 'decaps', label: 'Decaps', tag: 'FO', blurb: 'm′ = Dec(sk, c); (K̄′, r′) = G(m′ ‖ H(pk)); re-encrypt and compare; on mismatch K = KDF(z ‖ H(c)).',
      form: (api) => { const w = api.wallet().filter(isKem); if (!w.length) return note('Run <b>Encaps</b> first.'); const a = ctSelect(api, id + '-dk', isKem, w[w.length - 1].name); return opForm(api, [{ label: 'encapsulation', el: a }], 'Decapsulate', () => decapsOp(api, getCt(api, a.value))); } },
    { id: 'tamper', label: 'Tamper', tag: 'CCA', blurb: 'Change one ciphertext entry and decapsulate: the re-encryption check fails and the key owner returns an unrelated pseudorandom key (implicit rejection).',
      form: (api) => { const w = api.wallet().filter(fresh); if (!w.length) return note('Run <b>Encaps</b> first.'); const a = ctSelect(api, id + '-tk', fresh, w[w.length - 1].name);
        const t = h('select', { id: id + '-tt' }, ...S.targets(api.ctx).map(([v, l]) => h('option', { value: v, html: l }))); const dl = h('input', { id: id + '-td', type: 'number', value: 1, style: 'width:5em' });

  ];

  }

}

// ML-KEM (Kyber)

    { label: 'Noisy: q = 97, η = 3 (failures)', p: { n: 16, k: 2, q: 97, eta1: 3, eta2: 3, compress: false, du: 5, dv: 3, seed: 5 } },
  ];

    { key: 'n', label: 'Ring degree n', type: 'select', options: [8, 16], num: true, hint: 'R<sub>q</sub> = Z<sub>q</sub>[X]/(X<sup>n</sup>+1); real n = 256' },
    { key: 'k', label: 'Module rank k', type: 'select', options: [1, 2, 3, 4], num: true, hint: '2 / 3 / 4 in ML-KEM-512 / 768 / 1024' },
    { key: 'q', label: 'Modulus q', type: 'select', options: [[3329, '3329 (real)'], [257, '257'], [97, '97']], num: true },
    { key: 'eta1', label: 'η₁ (s, e, r)', type: 'number', min: 1, max: 8, hint: 'CBD values in [−η, η]' },
    { key: 'eta2', label: 'η₂ (e₁, e₂)', type: 'number', min: 1, max: 8 },
    { key: 'compress', label: 'Compress the ciphertext to d<sub>u</sub>, d<sub>v</sub> bits', type: 'check' },
    { key: 'du', label: 'd<sub>u</sub>', type: 'number', min: 1, max: 12 },
    { key: 'dv', label: 'd<sub>v</sub>', type: 'number', min: 1, max: 12 },
    { key: 'seed', label: 'Random seed', type: 'number', extra: lk_rand },
  ];
  function derive(p) {
    const n = Number(p.n), k = Number(p.k), q = Number(p.q), e1 = Number(p.eta1), e2 = Number(p.eta2), du = Number(p.du), dv = Number(p.dv), comp = !!p.compress;
    if (![8, 16].includes(n)) return { error: 'n must be 8 or 16.' }; if (!(k >= 1 && k <= 4)) return { error: 'k must be 1 … 4.' };
    if (![3329, 257, 97].includes(q)) return { error: 'q must be 3329, 257 or 97.' };
    if (![e1, e2].every((x) => Number.isInteger(x) && x >= 1 && x <= 8)) return { error: 'η₁, η₂ must be integers 1 … 8.' };

      list: [['Module dimension k·n', k * n], ['Noise σ (estimate)', sd.toFixed(1)], ['P[coefficient fails] ≈', lk_fmtP(pc)], ['P[message fails] ≈', lk_fmtP(pm)], ['Public key (toy)', `${pkB} B`], ['Ciphertext (toy)', `${ctB} B`], ['ML-KEM-512 pk / ct', '800 B / 768 B']] };

    steps.push({ title: 'Expand the public matrix A from ρ', why: `A is a k×k = ${k}×${k} matrix of polynomials with uniform coefficients in Z<sub>q</sub>. Only ρ (32 bytes) goes into the public key; anyone can re-expand A. Rows of the table are grouped by matrix row.`,
      formula: 'A<sub>ij</sub> = SampleUniform(XOF(ρ ‖ j ‖ i)) &nbsp; (rejection sampling of values below q)', table: Arows,
      node: () => matTable(A.map((r, i) => r.map((_, j) => `A${sub(i)}${sub(j)}(X)`)), { corner: 'A', rowLabel: (i) => `row ${i}`, colLabel: (j) => `col ${j}` }) });

      const prods = A[i].map((a, j) => lk_vmod(lk_rmul(a, S[j].v), q)); const as = lk_vmod(lk_sum(prods, n), q); As.push(as); const ti = lk_vmod(lk_add(as, E[i].v), q); T.push(ti);

        formula: `t<sub>${i}</sub> = ${A[i].map((_, j) => `A<sub>${i}${j}</sub>·s<sub>${j}</sub>`).join(' + ')} + e<sub>${i}</sub> &nbsp; (mod q)`,
        table: [...prods.map((pp, j) => ({ label: `A<sub>${i}${j}</sub>·s<sub>${j}</sub>`, v: pp, explain: (c) => lk_conv(A[i][j], S[j].v, c, `A<sub>${i}${j}</sub>`, `s<sub>${j}</sub>`, true, q) })), { label: `+ e<sub>${i}</sub>`, v: E[i].v }, '-', { label: `t<sub>${i}</sub> mod q`, v: ti, cls: 'hl' }] });

// =================== HQC ===================
function hqcDef() {
  const presets = [
    { label: 'n = 53, 3-bit messages (clearest)', p: { n: 53, k: 3, r: 17, w: 2, wr: 2, we: 2, seed: 1 } },
    { label: 'n = 101, 4-bit messages', p: { n: 101, k: 4, r: 25, w: 3, wr: 3, we: 3, seed: 2 } },
    { label: 'Heavy noise (fails often)', p: { n: 53, k: 4, r: 13, w: 4, wr: 4, we: 4, seed: 3 } },
  ];
  function derive(p) {
    const P = { n: Number(p.n), k: Number(p.k), r: Number(p.r), w: Number(p.w), wr: Number(p.wr), we: Number(p.we) };
    if (!isPrime(P.n)) return { error: 'n must be prime.' };
    if (!cb_twoPrimitive(P.n)) return { error: `2 must be a primitive root mod n (so that (X^n − 1)/(X − 1) is irreducible). For n = ${P.n} the order of 2 is ${cb_ordTwo(P.n)}. Try 53, 59, 61, 67, 83, 101.` };
    if (!(P.n <= 131)) return { error: 'Keep n ≤ 131 so the vectors stay readable.' };
    if (!(P.k >= 1 && P.r >= 3 && P.r % 2 === 1)) return { error: 'Need k ≥ 1 and an odd repetition factor r ≥ 3 (no ties in the majority vote).' };
    if (P.k * P.r > P.n) return { error: `The code length k·r = ${P.k * P.r} must be at most n = ${P.n}.` };
    if (![P.w, P.wr, P.we].every((x) => x >= 1 && x < P.n / 3)) return { error: 'Weights must be between 1 and n/3.' };
    const len = P.k * P.r, maxNoise = 2 * P.w * P.wr + P.we;
    return { ...P, len, maxNoise, chips: [['n', P.n], ['code', `[${len}, ${P.k}] repetition ×${P.r}`], ['w', P.w], ['w<sub>r</sub>', P.wr], ['w<sub>e</sub>', P.we]],
      list: [['Ring', `F<sub>2</sub>[X]/(X<sup>${P.n}</sup>−1)`], ['Message', `${P.k} bits`], ['Code length k·r', len], ['Block decodes if', `≤ ${(P.r - 1) / 2} flips`], ['Noise bound 2ww<sub>r</sub> + w<sub>e</sub>', maxNoise], ['Ciphertext bits', `${P.n} + ${len}`]] };
  }

    const rng = new RNG(Number(p.seed) || 1); const n = d.n; const steps = [];
    const hh = Array.from({ length: n }, () => rng.int(0, 1)); const x = cb_vecFromSupp(n, cb_pickDistinct(rng, n, d.w)); const y = cb_vecFromSupp(n, cb_pickDistinct(rng, n, d.w));
    const hy = cb_cmul(hh, y); const sv = cb_xor(x, hy);

      why: `Elements of R are ${n}-bit vectors; multiplying by X<sup>i</sup> rotates cyclically by i. Real HQC uses a concatenated Reed–Muller ⊗ Reed–Solomon code with n ≈ 17 669; the toy uses a repetition code decoded by majority vote. n is prime with 2 primitive mod n, as in HQC.`, node: () => paramChips(d.chips) });
    steps.push({ title: 'Sample h (public, uniform)', formula: `h ∈ R uniform, weight ${cb_wt(hh)}`, why: 'h is public and random; in the real scheme it is expanded from a seed.', node: () => cb_bitRows([{ label: 'h', v: hh }]) });
    steps.push({ title: `Sample the secret x, y of weight w = ${d.w}`, formula: `supp(x) = ${cb_suppTxt(x)}, &nbsp; supp(y) = ${cb_suppTxt(y)}`, why: 'The secret key is a pair of sparse vectors. Sparsity is what keeps the decryption noise small.',
      node: () => cb_bitRows([{ label: 'x', v: x, cls: (i, v) => (v ? 'bad' : '') }, { label: 'y', v: y, cls: (i, v) => (v ? 'bad' : '') }]) });
    steps.push({ title: 'Compute h·y by rotations', formula: `h·y = ${cb_supp(y).map((i) => `X${cb_sup(i)}·h`).join(' ⊕ ')}`, why: `Since y has ${d.w} ones, h·y is the XOR of ${d.w} cyclic shifts of h.`,
      node: () => cb_bitRows([...cb_rotRows(hh, 'h', cb_supp(y)), '-', { label: 'h·y', v: hy }]) });
    steps.push({ title: 's = x + h·y (public)', formula: 'pk = (h, s), &nbsp; sk = (x, y)', why: 'Recovering the sparse x, y from (h, s) is the quasi-cyclic syndrome decoding problem: s is a syndrome of the sparse error (x, y) for the parity-check matrix [1 | h].',
      node: () => cb_bitRows([{ label: 'x', v: x }, { label: 'h·y', v: hy }, '-', { label: 's', v: sv }]) });
    return { d, p, h: hh, x, y, hy, s: sv, rng: new RNG((Number(p.seed) || 1) * 104729 + 7), sigma: Array.from({ length: 16 }, () => rng.int(0, 255)), steps };
  }

  function encSteps(ctx, ct) {
    const d = ctx.d, n = d.n; const steps = [];
    steps.push({ title: 'Encode the message with the public code', formula: `m = ${cb_bitstr(ct.m)} &nbsp;→&nbsp; mG = ${ct.m.map((b) => String(b).repeat(3) + '…').join(' ')} (${d.len} bits)`, why: `Each message bit becomes a block of ${d.r} equal bits. Drawn one block per row.`,
      node: () => bitGrid(ct.mG.slice(0, d.len), { cols: d.r, text: (i, v) => v, caption: `mG: ${d.k} blocks of ${d.r} bits` }) });
    steps.push({ title: 'Sample the encryption randomness', formula: `wt(r<sub>1</sub>) = wt(r<sub>2</sub>) = ${d.wr}, &nbsp; wt(e) = ${d.we}`, why: 'Fresh sparse vectors for every encryption, like the secret key.',
      node: () => cb_bitRows([{ label: 'r₁', v: ct.r1, cls: (i, v) => (v ? 'bad' : '') }, { label: 'r₂', v: ct.r2, cls: (i, v) => (v ? 'bad' : '') }, { label: 'e', v: ct.e, cls: (i, v) => (v ? 'bad' : '') }]) });

      { title: 'Reveal one secret per position', why: 'For each i, publish x<sub>d<sub>i</sub>,i</sub>. The other half x<sub>1−d<sub>i</sub>,i</sub> stays secret: that is what makes a different digest unforgeable.', formula: 'σ<sub>i</sub> = x<sub>d<sub>i</sub>, i</sub>',

        node: () => h('div', {}, hb_wotsGrid(W, vals, { digits: S.D.all }), hb_tab(['chain', 'd<sub>i</sub>', 'sk<sub>i</sub>', 'σ<sub>i</sub> = F<sup>d<sub>i</sub></sup>(sk<sub>i</sub>)'], S.sig.map((x, i) => [hb_dlab(W, i), String(S.D.all[i]), hex(ctx.wk.sk[i]), hex(x)]))) },
      { title: `Signature ${name}`, formula: `σ = (σ₀, …, σ${sub(W.len - 1)}) &nbsp; ${W.len} × ${W.n} = ${W.len * W.n} bytes`, why: before ? `<b>Key reuse!</b> This one-time key already signed ${before} message(s). Two signatures reveal, per chain, the smaller of the two positions, which lets an attacker sign messages whose digits are all at least those minima.` : 'The key is now used. WOTS+ is a one-time signature.', node: before ? note(`Warning: one-time key reused (${ctx.used} signatures).`, 'warnnote') : null }];

  }
  function verifySteps(ctx, item, M) {
    const W = ctx.W, V = verifyCore(ctx, item.sig, M); const ds = hb_digitSteps(W, V.m, 'm');

      { title: 'Complete every chain', why: 'From σ<sub>i</sub> at position d<sub>i</sub>, apply F the remaining w−1−d<sub>i</sub> times. A genuine signature lands exactly on the public chain end pk<sub>i</sub>.', formula: 'pk′<sub>i</sub> = F<sup>w−1−d<sub>i</sub></sup>(σ<sub>i</sub>) =? pk<sub>i</sub>',
        node: () => h('div', {}, hb_wotsGrid(W, V.R.rows, { digits: V.R.D.all, mode: 'verify', ok: V.okc }), hb_tab(['chain', 'd<sub>i</sub>', 'steps', 'σ<sub>i</sub>', 'pk′<sub>i</sub>', 'pk<sub>i</sub>', ''], item.sig.map((x, i) => [hb_dlab(W, i), String(V.R.D.all[i]), String(W.w - 1 - V.R.D.all[i]), hex(x), hex(V.R.pk[i]), hex(ctx.wk.pk[i]), hb_ck(V.okc[i])]))) },

  }
  function checksumDemo(api, base) {
    const ctx = api.ctx, W = ctx.W, K = ctx.K; const steps = [];
    const P = (md) => md.reduce((a, d) => a * (W.w - d) / W.w, 1);
    let best = null; for (let k = 0; k < 200; k++) { const M = k ? `${base} #${k}` : base; const D = hb_digits(W, digest(K, M)); const pr = P(D.md) - (D.md.every((d) => d === W.w - 1) ? 1 : 0); if (!best || pr > best.pr) best = { M, pr }; }
    const s = signCore(api, best.M); const D = hb_digits(W, digest(K, best.M));
    steps.push({ title: `The owner signs M = "${hb_esc(best.M)}"`, why: `(We picked, among variants of the text, a message with small digits, so the attack below finishes quickly; the attacker needs only one such signature.) A fraction ≈ ${best.pr.toPrecision(2)} of all messages has every digit ≥ these.`, node: () => vecTable([{ label: 'd<sub>i</sub>', v: D.all, cls: 'hl', mark: D.all.map((_, i) => i >= W.len1) }], (i) => hb_dlab(W, i)) });
    let F = null, tries = 0; const lim = Math.min(120000, Math.ceil(40 / Math.max(best.pr, 1e-9)));
    for (let k = 0; k < lim; k++) { const M = `${best.M} forged-${k}`; tries++; const md = hb_baseW(digest(K, M), W.lgw, W.len1); if (md.every((d, i) => d >= D.md[i]) && md.some((d, i) => d > D.md[i])) { F = { M, D2: hb_digits(W, digest(K, M)) }; break; } }
    if (!F) { steps.push({ title: 'No candidate found', why: `No message among ${tries} tries has all digits ≥ those of M (expected ~${Math.round(1 / best.pr)} tries). With n = ${W.n}, w = ${W.w} the search is too long for a browser demo: choose n ≤ 4.` }); api.show('Why the checksum', steps); return { ok: false, tries }; }

    steps.push({ title: 'Attacker finds M′ with all message digits ≥', why: `Search M′ = "…forged-0", "…forged-1", …. Found after ${tries} ${tries === 1 ? 'try' : 'tries'}.`, formula: `M′ = "${hb_esc(F.M)}"`, node: () => vecTable([{ label: 'd(M)', v: D.md }, { label: 'd(M′)', v: D2.md, cls: 'hl', mark: D2.md.map((d, i) => d > D.md[i]) }], (i) => `m${sub(i)}`) });

    steps.push({ title: 'Without a checksum: advance the chains', why: 'Anyone can move forward along a chain. Advancing σ<sub>i</sub> by d′<sub>i</sub> − d<sub>i</sub> steps gives a valid value for M′ on every message chain. If WOTS had no checksum, this would be a forgery.', formula: 'σ′<sub>i</sub> = F<sup>d′<sub>i</sub>−d<sub>i</sub></sup>(σ<sub>i</sub>) &nbsp; ⇒ &nbsp; F<sup>w−1−d′<sub>i</sub></sup>(σ′<sub>i</sub>) = pk<sub>i</sub>',
      node: () => h('div', {}, hb_tab(['chain', 'd<sub>i</sub>', 'd′<sub>i</sub>', 'σ<sub>i</sub>', 'σ′<sub>i</sub>', 'reaches pk<sub>i</sub>'], adv.map((x, i) => [hb_dlab(W, i), String(D.md[i]), String(D2.md[i]), hex(s.item.sig[i]), hex(x), hb_ck(okNo[i])])), resBox(okNo.every(Boolean), 'Checksum-less WOTS: forgery accepted', `all ${W.len1} message chains verify for M′`)) });
    const need = D2.cd.map((c, j) => c - D.cd[j]);

      formula: `csum(M) = ${D.csum} → (${D.cd.join(', ')}) &nbsp; csum(M′) = ${D2.csum} → (${D2.cd.join(', ')})`, node: () => hb_tab(['chain', 'c<sub>j</sub>(M)', 'c<sub>j</sub>(M′)', 'steps needed'], D2.cd.map((c, j) => [hb_dlab(W, W.len1 + j), String(D.cd[j]), String(c), need[j] < 0 ? { html: `${need[j]} (invert F!)`, cls: 'bad' } : String(need[j])])) });

    const V = verifyCore(ctx, sig2, F.M);
    steps.push({ title: 'Real WOTS+ verification of the attempt', why: 'The attacker keeps the old σ on the chains he cannot move back. Full verification (with checksum chains) rejects it.', node: () => h('div', {}, hb_wotsGrid(W, V.R.rows, { digits: V.R.D.all, mode: 'verify', ok: V.okc }), resBox(V.ok, V.ok ? 'Accepted (unexpected)' : 'Forgery rejected', V.ok ? '' : `checksum chain(s) ${V.okc.map((x, i) => (x ? null : hb_dlab(W, i))).filter(Boolean).join(', ')} do not reach pk`)) });

  return {
    id: 'wots', version: 1, title: 'WOTS+ (Winternitz one-time signature)',
    intro: 'WOTS+ trades signature size for hashing: each base-w digit of the digest selects a position on a hash chain of length w − 1, so one n-byte value signs log₂w bits. A checksum stops an attacker from moving chains forward. It is the one-time signature inside XMSS, LMS (as LM-OTS) and SLH-DSA. <i>Toy sizes: n ≤ 8 bytes; real WOTS+ uses n = 16–32 and w = 16.</i>',
    presets: [{ label: 'w = 16, n = 4 bytes', p: { n: 4, w: 16, seed: 1 } }, { label: 'w = 4, n = 2 bytes (short chains)', p: { n: 2, w: 4, seed: 5 } }, { label: 'w = 16, n = 2 bytes', p: { n: 2, w: 16, seed: 9 } }],
    fields: () => [hb_nF, hb_numF('w', 'Winternitz parameter w', [[4, '4'], [16, '16']], 'Chain length w − 1.'), hb_seedF],
    derive(p) { const n = Number(p.n), w = Number(p.w); if (![2, 4, 8].includes(n)) return { error: 'n must be 2, 4 or 8.' }; if (![4, 16].includes(w)) return { error: 'w must be 4 or 16.' };
      const x = hb_wotsDerive(n, w); const W = x.W; return { n, w, W, chips: [['n', `${n} B`], ['w', w], ['len₁', W.len1], ['len₂', W.len2], ['sig', `${W.len * n} B`]], list: [...x.list, ['Hashes in keygen', W.len * (w - 1)]] }; },
    keygen(p, d) {
      const K = hb_K(d.n, new RNG(Number(p.seed) || 1)); const W = d.W; const wk = hb_wotsKey(K, W, BASE);
      const ctx = { K, W, wk, used: 0, d, p };
      ctx.steps = [hb_hashStep(K, hb_A({ type: HB_T.WOTS, ch: 2, pos: 5 })),
        { title: 'Chain count', why: `Each chain signs one base-${d.w} digit (log₂w = ${W.lgw} bits). The n-byte digest needs len₁ chains; the checksum needs len₂ more.`, formula: `len₁ = ⌈8·${d.n} / ${W.lgw}⌉ = ${W.len1}; max checksum = len₁(w−1) = ${W.len1 * (d.w - 1)} → len₂ = ⌊log₂ ${W.len1 * (d.w - 1)} / ${W.lgw}⌋ + 1 = ${W.len2}; len = ${W.len}` },
        { title: 'Secret chain starts', formula: 'sk<sub>i</sub> = PRF(ADRS⟨WOTS_PRF, chain i⟩)', node: () => hb_tab(['chain', 'sk<sub>i</sub>'], wk.sk.map((x, i) => [hb_dlab(W, i), hex(x)])) },
        { title: 'Chain 0 in detail', why: 'Each step hashes the previous value with an address naming the chain and the position, so every link uses a different tweak.', formula: hb_hashExample(K, hb_A({ type: HB_T.WOTS, ch: 0, pos: 0 }), wk.sk[0], 'F(sk₀)'),
          node: () => h('div', {}, chainSvg(wk.chains[0].map((v, j) => ({ label: d.w === 16 ? hex(v, 2) : hb_lbl(v, 4), sub: j === 0 ? 'sk₀' : j === d.w - 1 ? 'pk₀' : String(j), cls: j === 0 ? 'hl' : j === d.w - 1 ? 'ok' : '', title: hex(v) })), { boxW: d.w === 16 ? 44 : 80, gap: d.w === 16 ? 12 : 26, caption: d.w === 16 ? 'First 2 bytes of each link.' : '' }),
            hb_tab(['j', 'ADRS', 'input', 'F output'], wk.chains[0].slice(0, -1).map((v, j) => [String(j), hb_adrsStr(hb_A({ type: HB_T.WOTS, ch: 0, pos: j })), hex(v), hex(wk.chains[0][j + 1])]))) },
        { title: 'All chains', why: `Repeat for every chain: ${W.len} × ${d.w - 1} = ${W.len * (d.w - 1)} hashes. The chain ends are pk<sub>i</sub>.`, formula: 'pk<sub>i</sub> = F<sup>w−1</sup>(sk<sub>i</sub>)', node: () => hb_wotsGrid(W, wk.chains, {}) },
        { title: 'Compress the public key', why: 'The len chain ends are hashed into one n-byte value. This is the WOTS+ public key (in SLH-DSA, the leaf of a Merkle tree).', formula: `PK = T(ADRS⟨WOTS_PK⟩, pk₀ ‖ … ‖ pk${sub(W.len - 1)}) = <b>${hex(wk.pkc)}</b>` }];
      return ctx;
    },
    keyText: (c) => [`SK: ${c.W.len} chain starts sk₀ = ${hex(c.wk.sk[0])}, … &nbsp; state: ${c.used ? `<b>used ${c.used}×</b>` : 'unused'}`, `PK = ${hex(c.wk.pkc)} (hash of ${c.W.len} chain ends)`],
    ctInfo: (ct, ctx) => { const V = verifyCore(ctx, ct.sig, ct.msg); return { ok: V.ok, chips: [[V.ok ? 'valid' : 'invalid', V.ok ? 'ok' : 'bad'], ...(ct.forged ? [['forgery attempt', 'warn']] : []), ...(ct.tampered ? [['tampered', 'warn']] : [])] }; },
    ops: [
      { id: 'sign', label: 'Sign', blurb: 'Digits + checksum select chain positions.', form: (api) => { const m = hb_msgIn(hb_nextMsg(api)); return opForm(api, [{ label: 'Message M', el: m }], 'Sign', () => { const r = signCore(api, m.value); api.show(`Sign "${hb_esc(m.value)}" → ${r.item.name}`, r.steps); }); } },
      { id: 'verify', label: 'Verify', blurb: 'Complete every chain and compare with the public key.', form: (api) => hb_verifyForm(api, 'wots', (c, M) => api.show(`Verify ${c.name}`, verifySteps(api.ctx, c, M).steps)) },
      { id: 'tamper', label: 'Tamper', blurb: 'Change the message or a chain value.', form: (api) => hb_tamperForm(api, 'wots', [['msg', 'the message'], ['sig', 'one byte of σ₀']], (c, what) => {
        const it = { name: api.nextName('bad'), tampered: true, msg: what === 'msg' ? c.msg + '!' : c.msg, sig: what === 'sig' ? [hb_flip(c.sig[0]), ...c.sig.slice(1)] : c.sig, desc: `tampered ${c.name}` }; api.addCt(it);
        api.show(`Tamper ${c.name} and verify`, [{ title: 'The change', formula: what === 'msg' ? `M: "${hb_esc(c.msg)}" → "${hb_esc(it.msg)}"` : `σ₀: ${hex(c.sig[0])} → ${hex(it.sig[0])}` }, ...verifySteps(api.ctx, it, it.msg).steps]); }) },
      { id: 'checksum', label: 'Why the checksum', tag: 'attack', blurb: 'Sign one message, then try to forge by advancing chains. It works without the checksum and fails with it.', form: (api) => { const m = hb_msgIn('transfer 10'); return opForm(api, [{ label: 'Base text', el: m }], 'Run the attack', () => checksumDemo(api, m.value)); } },

}

// =============================== 3. XMSS / LMS ===============================
function hb_xmssDef() {
  const TA = (k, j) => hb_A({ type: HB_T.TREE, ch: k, pos: j });
  const msgHash = (ctx, r, idx, M) => H(r, ctx.root, [idx], M).slice(0, ctx.K.n);
  function verifyCore(ctx, it, M) {
    const m = msgHash(ctx, it.r, it.idx, M); const R = hb_wotsPk(ctx.K, ctx.W, { layer: 0, tree: 0, kp: it.idx }, it.sig, m);
    const C = hb_climb(ctx.K, R.pkc, it.idx, it.auth, TA); return { m, R, C, ok: bytesEq(C.root, ctx.root) };
  }
  function sigAt(ctx, idx, M) { const rr = H(ctx.K.skPrf, [idx]).slice(0, ctx.K.n); const m = msgHash(ctx, rr, idx, M); const S = hb_wotsSign(ctx.K, ctx.W, ctx.wks[idx], m);  return { r: rr, m, S, auth: hb_auth(ctx.levels, idx) }; }
  function signCore(api, M) {
    const ctx = api.ctx, W = ctx.W, N = ctx.levels[0].length;
    if (ctx.next >= N) throw new Error(`Key exhausted: all 2^h = ${N} one-time keys are used. A stateful key must never sign again.`);
    const idx = ctx.next; ctx.next++;
    const X = sigAt(ctx, idx, M); const name = api.nextName('sig');
    const ds = hb_digitSteps(W, X.m, 'm');
    const steps = [
      { title: 'Read and update the state', why: `The secret key holds a counter. It must be advanced and <b>stored</b> before the signature is released: if a crash or a restored backup rolls it back, a one-time key is used twice.`, formula: `idx = ${idx}; &nbsp; state ← ${idx + 1} &nbsp; (${N - idx - 1} signatures left)` },
      { title: 'Randomized message digest', why: 'The randomizer r makes the digest unpredictable to anyone without SK.prf; idx and the root bind the digest to this key and leaf.', formula: `r = PRF(SK.prf, idx) = ${hex(X.r)}<br>m = H(r ‖ root ‖ idx ‖ "${hb_esc(M)}")[0 … ${W.n - 1}] = <b>${hex(X.m)}</b>` },
      ...ds.steps,
      { title: `WOTS+ signature with leaf ${idx}`, why: `One-time key number ${idx} signs m.`, formula: 'σ<sub>i</sub> = F<sup>d<sub>i</sub></sup>(sk<sub>idx,i</sub>)', node: () => hb_tab(['chain', 'd<sub>i</sub>', 'σ<sub>i</sub>'], X.S.sig.map((x, i) => [hb_dlab(W, i), String(X.S.D.all[i]), hex(x)])) },
      { title: 'Authentication path', why: `The h = ${ctx.d.h} sibling nodes on the way from leaf ${idx} to the root (orange). With them the verifier can recompute the root.`, formula: `auth<sub>k</sub> = node(height k, index ⌊idx / 2<sup>k</sup>⌋ ⊕ 1)`,
        node: () => h('div', {}, hb_treeFig(ctx.levels, hb_pathCls(idx), `Leaf ${idx} and its ancestors in blue; authentication path in orange.`), hb_tab(['k', 'node index', 'auth<sub>k</sub>'], X.auth.map((a, k) => [String(k), String((idx >> k) ^ 1), hex(a)]))) },
      { title: `Signature ${name}`, formula: `Σ = (idx = ${idx}, r, σ, auth) &nbsp; ${4} + ${W.n} + ${W.len}·${W.n} + ${ctx.d.h}·${W.n} = ${4 + W.n * (1 + W.len + ctx.d.h)} bytes`, node: resBox(true, `state = ${ctx.next} / ${N}`, ctx.next === N ? 'this was the last one-time key: the key is now exhausted' : `${N - ctx.next} signatures left`) },
    ];
    const item = { name, msg: M, idx, r: X.r, sig: X.S.sig, auth: X.auth, desc: `Sig("${hb_esc(M)}") · leaf ${idx}` }; api.addCt(item); return { item, steps };
  }
  function verifySteps(ctx, it, M) {
    const W = ctx.W, V = verifyCore(ctx, it, M);
    const comp = (k, j) => { if (k === 0) return j === it.idx ? 'hl' : j === (it.idx ^ 1) ? 'path' : 'dim'; if (j === (it.idx >> k)) return k === ctx.d.h ? (V.ok ? 'ok' : 'bad') : 'hl'; if (j === ((it.idx >> k) ^ 1)) return 'path'; return 'dim'; };
    const levels = ctx.levels.map((L, k) => L.map((v, j) => (k === 0 && j === it.idx ? V.R.pkc : k > 0 && j === (it.idx >> k) ? V.C.rows[k - 1].out : k < ctx.d.h && j === ((it.idx >> k) ^ 1) ? it.auth[k] : v)));
    return { V, steps: [
      { title: 'Recompute the digest', formula: `m = H(r ‖ root ‖ ${it.idx} ‖ "${hb_esc(M)}")[0 … ${W.n - 1}] = ${hex(V.m)}` },
      { title: `Recover the WOTS+ public key of leaf ${it.idx}`, why: 'Complete each chain from σ<sub>i</sub>, then compress. The result is the leaf the signer must have used.', formula: `pk′<sub>i</sub> = F<sup>w−1−d<sub>i</sub></sup>(σ<sub>i</sub>); &nbsp; leaf′ = T(ADRS⟨WOTS_PK, kp ${it.idx}⟩, pk′₀ ‖ …) = <b>${hex(V.R.pkc)}</b>`,
        node: () => hb_tab(['chain', 'd<sub>i</sub>', 'σ<sub>i</sub>', 'pk′<sub>i</sub>'], it.sig.map((x, i) => [hb_dlab(W, i), String(V.R.D.all[i]), hex(x), hex(V.R.pk[i])])) },
      { title: 'Climb the tree with the authentication path', why: `Bit k of idx = ${it.idx} (binary ${it.idx.toString(2).padStart(ctx.d.h, '0')}) says whether the current node is a right child (auth goes left) or a left child.`, formula: 'node<sub>k+1</sub> = T(ADRS⟨TREE, height k+1, index⌊idx/2<sup>k+1</sup>⌋⟩, left ‖ right)', node: () => hb_climbTable(V.C.rows, 'idx') },
      { title: 'Compare with the public root', node: () => h('div', {}, hb_treeFig(levels, comp, 'Blue: recomputed by the verifier; orange: taken from the signature; faded: never seen.'), resBox(V.ok, V.ok ? 'Valid signature' : 'Invalid signature', `computed root ${hex(V.C.root)} ${V.ok ? '=' : '≠'} PK.root ${hex(ctx.root)}`)) },
    ] };
  }
  function reuse(api, M2) {
    const ctx = api.ctx, W = ctx.W, K = ctx.K; const idx = Math.max(0, ctx.next - 1); const steps = [];
    let first = api.wallet().find((c) => c.idx === idx && !c.tampered && !c.forged && !c.reused);
    if (!first) { if (ctx.next === 0) { first = signCore(api, 'first message').item; } else throw new Error('No signature for the last leaf in the wallet.'); }
    const X = sigAt(ctx, idx, M2); const name2 = api.nextName('reuse'); const it2 = { name: name2, msg: M2, idx, r: X.r, sig: X.S.sig, auth: X.auth, reused: true, desc: `Sig("${hb_esc(M2)}") · leaf ${idx} again` }; api.addCt(it2);
    const d1 = hb_digits(W, msgHash(ctx, first.r, idx, first.msg)).all, d2 = X.S.D.all; const mn = d1.map((d, i) => Math.min(d, d2[i]));
    steps.push({ title: 'State rolled back', why: `Suppose the key file was restored from a backup (or two servers share it). The counter says idx = ${idx} again, so leaf ${idx} signs a second message. XMSS cannot detect this; that is why SP 800-208 requires the state to be managed in hardware.`, formula: `${first.name}: leaf ${idx}, "${hb_esc(first.msg)}" &nbsp; ${name2}: leaf ${idx}, "${hb_esc(M2)}"` });

    const sig = F.D.map((d, i) => hb_chain(K, { layer: 0, tree: 0, kp: idx }, i, src(i), mn[i], d - mn[i]));

    steps.push({ title: 'Search a message whose digits are all ≥ the minima', why: `Probability per try ≈ ${Pp.toPrecision(2)}. Found after ${tries} ${tries === 1 ? 'try' : 'tries'}.`, formula: `M* = "${hb_esc(F.M)}"`, node: () => vecTable([{ label: 'min', v: mn }, { label: 'd(M*)', v: F.D, cls: 'hl', mark: F.D.map((d, i) => d > mn[i]) }], (i) => hb_dlab(W, i)) });
    const V = verifyCore(ctx, it3, F.M);
    steps.push({ title: 'Forge: advance the chains, reuse r and the auth path', formula: 'σ*<sub>i</sub> = F<sup>d*<sub>i</sub> − min<sub>i</sub></sup>(value at min<sub>i</sub>)', node: () => h('div', {}, hb_tab(['chain', 'min<sub>i</sub>', 'd*<sub>i</sub>', 'σ*<sub>i</sub>'], sig.map((x, i) => [hb_dlab(W, i), String(mn[i]), String(F.D[i]), hex(x)])), resBox(V.ok, V.ok ? `Forgery ${it3.name} accepted` : 'Forgery rejected', `a valid XMSS signature on "${hb_esc(F.M)}" without the secret key`)) });

  return {
    id: 'xmss', version: 1, title: 'XMSS / LMS (stateful Merkle signatures)',
    intro: 'A Merkle tree turns 2<sup>h</sup> WOTS+ one-time keys into one public key: the root. A signature is the leaf index, a WOTS+ signature and the authentication path. The signer must keep a <b>state</b> (the next unused leaf) and never reuse it. XMSS (RFC 8391) and LMS (RFC 8554) are standardised in NIST SP 800-208 for uses such as firmware signing. <i>Toy sizes: n ≤ 8 bytes, h ≤ 4; real XMSS uses n = 32, h = 10–20.</i>',
    presets: [{ label: 'h = 3 (8 signatures), w = 16', p: { n: 4, h: 3, w: 16, seed: 1 } }, { label: 'h = 2 (exhausts after 4)', p: { n: 4, h: 2, w: 16, seed: 4 } }, { label: 'h = 4, n = 2, w = 4', p: { n: 2, h: 4, w: 4, seed: 2 } }],
    fields: () => [hb_nF, hb_numF('h', 'Tree height h', [[2, '2 (4 leaves)'], [3, '3 (8 leaves)'], [4, '4 (16 leaves)']]), hb_numF('w', 'Winternitz w', [[4, '4'], [16, '16']]), hb_seedF],
    derive(p) { const n = Number(p.n), hh = Number(p.h), w = Number(p.w); if (![2, 4, 8].includes(n) || ![2, 3, 4].includes(hh) || ![4, 16].includes(w)) return { error: 'Choose n ∈ {2,4,8}, h ∈ {2,3,4}, w ∈ {4,16}.' };
      const x = hb_wotsDerive(n, w); return { n, h: hh, w, W: x.W, chips: [['n', `${n} B`], ['h', hh], ['leaves', 2 ** hh], ['w', w], ['len', x.W.len], ['sig', `${4 + n * (1 + x.W.len + hh)} B`]], list: [...x.list, ['Signatures per key 2<sup>h</sup>', 2 ** hh], ['Signature 4 + n(1 + len + h)', `${4 + n * (1 + x.W.len + hh)} B`]] }; },
    keygen(p, d) {

          node: () => hb_tab(['leaf i', 'sk<sub>i,0</sub>', 'pk<sub>i,0</sub> = F<sup>w−1</sup>(sk<sub>i,0</sub>)', '…', 'leaf<sub>i</sub>'], wks.map((x, i) => [String(i), hex(x.sk[0]), hex(x.pk[0]), '…', { html: hex(x.pkc) }])) }];

          node: () => h('div', {}, hb_tab(['j', 'left', 'right', `node<sub>${kk},j</sub>`], levels[kk].map((v, j) => [String(j), hex(levels[kk - 1][2 * j]), hex(levels[kk - 1][2 * j + 1]), { html: hex(v) }])), hb_treeFig(levels.slice(0, kk + 1), (a) => (a === kk ? 'hl' : ''), '')) });
      }
      steps.push({ title: 'Public key = root; state = 0', why: `PK = (PK.seed, root). The secret key is (SK.seed, SK.prf, <b>idx = 0</b>). ${K.calls} hash calls were needed: key generation of XMSS is expensive for large h.`, formula: `root = <b>${hex(root)}</b>`, node: () => hb_treeFig(levels, (k) => (k === d.h ? 'ok' : ''), 'The whole Merkle tree. Hover a node for its full value.') });
      ctx.steps = steps; return ctx;
    },
    keyText: (c) => [`SK: SK.seed = ${hex(c.K.skSeed)}, SK.prf, <b>state idx = ${c.next}</b> of ${c.levels[0].length}`, `PK: root = ${hex(c.root)}, PK.seed = ${hex(c.K.pkSeed)}`],
    ctInfo: (ct, ctx) => { const V = verifyCore(ctx, ct, ct.msg); return { ok: V.ok, chips: [[V.ok ? 'valid' : 'invalid', V.ok ? 'ok' : 'bad'], [`leaf ${ct.idx}`], ...(ct.reused ? [['leaf reused', 'bad']] : []), ...(ct.forged ? [['forged', 'warn']] : []), ...(ct.tampered ? [['tampered', 'warn']] : [])] }; },
    ops: [
      { id: 'sign', label: 'Sign', blurb: 'Uses the next unused leaf and advances the state.', form: (api) => { const m = hb_msgIn(hb_nextMsg(api)); return opForm(api, [{ label: 'Message M', el: m }], 'Sign', () => { const r = signCore(api, m.value); api.show(`Sign "${hb_esc(m.value)}" → ${r.item.name}`, r.steps); }); } },
      { id: 'verify', label: 'Verify', blurb: 'Recover the leaf from the WOTS+ signature, then climb to the root.', form: (api) => hb_verifyForm(api, 'xmss', (c, M) => api.show(`Verify ${c.name}`, verifySteps(api.ctx, c, M).steps)) },
      { id: 'tamper', label: 'Tamper', blurb: 'Change the message, an auth-path node or the leaf index.', form: (api) => hb_tamperForm(api, 'xmss', [['msg', 'the message'], ['auth', 'one byte of auth₀'], ['idx', 'the leaf index']], (c, what) => {
        const it = { ...c, name: api.nextName('bad'), tampered: true, reused: false, forged: false, desc: `tampered ${c.name}` };

      { id: 'reuse', label: 'Reuse a leaf', tag: 'danger', blurb: 'Roll the state back one step and sign another message with the same leaf. Two WOTS+ signatures from one key allow a forgery.', form: (api) => { const m = hb_msgIn('pay Bob 20'); return opForm(api, [{ label: 'Second message', el: m }], 'Roll back and sign', () => reuse(api, m.value)); } },
    ],
    selftest(api) {
      const ctx = api.ctx, N = ctx.levels[0].length; let ok = true, tam = true;

    },
  };
}

// =============================== 4. SLH-DSA ===============================
function hb_slhDef() {
  const D_ = 2, HP = 2;
  function tree(ctx, layer, t) { const key = layer + ':' + t; if (ctx.trees[key]) return ctx.trees[key]; const wks = Array.from({ length: 2 ** HP }, (_, i) => hb_wotsKey(ctx.K, ctx.W, { layer, tree: t, kp: i })); const levels = hb_merkle(ctx.K, wks.map((x) => x.pkc), (k, j) => hb_A({ layer, tree: t, type: HB_T.TREE, ch: k, pos: j })); return (ctx.trees[key] = { layer, t, wks, levels, root: levels[HP][0] }); }
  const TA = (layer, t) => (k, j) => hb_A({ layer, tree: t, type: HB_T.TREE, ch: k, pos: j });
  const FA = (d, it, il, t) => (k, j) => hb_A({ layer: 0, tree: it, type: HB_T.FORS, kp: il, ch: k, pos: t * 2 ** (d.a - k) + j });

    const md = Array.from({ length: d.k }, (_, t) => bitsToInt(bits.slice(t * d.a, (t + 1) * d.a))); const o = d.k * d.a; return { dg, bits, md, it: bitsToInt(bits.slice(o, o + HP)), il: bitsToInt(bits.slice(o + HP, o + 2 * HP)) }; }
  const forsPkA = (it, il) => hb_A({ layer: 0, tree: it, type: HB_T.FORSPK, kp: il });
  function signCore(ctx, M) {
    const d = ctx.d, K = ctx.K; const R = H(K.skPrf, K.pkSeed, M).slice(0, K.n); const G = digest(ctx, R, M);
    const F = G.md.map((j, t) => { const f = fors(ctx, G.it, G.il, t); return { f, j, sk: f.sk[j], auth: hb_auth(f.levels, j), root: f.levels[d.a][0] }; });
    const fpk = hb_T(K, forsPkA(G.it, G.il), ...F.map((x) => x.root));

  }
  // schematic of the hypertree

    const tri = (cx, y0, w, hh, cls) => s('path', { d: `M ${cx} ${y0} L ${cx + w / 2} ${y0 + hh} L ${cx - w / 2} ${y0 + hh} Z`, class: 'node ' + cls });

      svg.append(s('line', { x1: lx, y1: 176, x2: x0 + tot / 2, y2: 214, class: 'edge hl' }));

      svg.append(s('text', { x: 8, y: 240, class: 'lbl' }, 'FORS')); svg.append(s('text', { x: 8, y: 254, class: 'lbl' }, `k = ${d.k}, a = ${d.a}`)); }

  }
  const fig = (levels, idx, cap) => hb_treeFig(levels, hb_pathCls(idx), cap);
  function wotsTab(W, S, auth) { return hb_tab(['chain', 'd<sub>i</sub>', 'σ<sub>i</sub>'], S.sig.map((x, i) => [hb_dlab(W, i), String(S.D.all[i]), hex(x)])); }
  function signSteps(api, M) {
    const ctx = api.ctx, d = ctx.d, W = ctx.W; const X = signCore(ctx, M); const G = X.G; const name = api.nextName('sig');
    const grp = (i) => (i < d.k * d.a ? 'md' + Math.floor(i / d.a) : i < d.k * d.a + HP ? 'tree' : 'leaf');
    const steps = [
      { title: 'Randomizer R', why: 'Deterministic variant: R depends on SK.prf and M. It makes the digest unpredictable, so an attacker cannot aim at particular FORS leaves.', formula: `R = PRF<sub>msg</sub>(SK.prf, PK.seed, M) = H(${hex(ctx.K.skPrf)} ‖ ${hex(ctx.K.pkSeed)} ‖ "${hb_esc(M)}")[0 … ${d.n - 1}] = <b>${hex(X.R)}</b>` },

      node: () => h('div', {}, hb_tab(['j', ...x.f.sk.map((_, j) => String(j))], [['sk', ...x.f.sk.map((v) => hex(v))], ['leaf = T(sk)', ...x.f.levels[0].map((v) => hex(v))]]), fig(x.f.levels, x.j, `root<sub>${t}</sub> = ${hex(x.root)}`)) }));

const mv_zeros = (r, c) => Array.from({ length: r }, () => Array(c).fill(0));

function mv_irred(m, q) { // first monic irreducible z^m + f_{m-1} z^{m-1} + … + f_0 (coefficients low→high, without the leading 1)
  const rem = (a, b) => { a = a.slice(); while (a.length >= b.length) { const c = mod(a[a.length - 1] * invMod(b[b.length - 1], q), q); const sh = a.length - b.length; for (let i = 0; i < b.length; i++) a[sh + i] = mod(a[sh + i] - c * b[i], q); a.pop(); } return a; };
  const monics = (d) => { const r = []; const tot = q ** d; for (let k = 0; k < tot; k++) { const c = []; let x = k; for (let i = 0; i < d; i++) { c.push(x % q); x = Math.floor(x / q); } r.push([...c, 1]); } return r; };
  const cands = monics(m).sort((a, b) => a.filter(Boolean).length - b.filter(Boolean).length);
  for (const f of cands) { if (!f[0]) continue; let irr = true; for (let d = 1; d <= m / 2 && irr; d++) for (const g of monics(d)) if (rem(f, g).every((x) => x === 0)) { irr = false; break; } if (irr) return f.slice(0, m); }
  throw new Error('no irreducible polynomial');
}
