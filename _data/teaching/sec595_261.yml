  - label: Prerequisites
    value: Graduate standing

description: >-
  Mathematical foundations: algebraic structures, hardness assumptions, and
  lattice primitives (LWE/RLWE). Lattice-based post-quantum cryptography: key
  encapsulation mechanisms, digital signatures. Homomorphic encryption: partial
  (PHE), leveled (LHE), and fully homomorphic encryption (FHE); bootstrapping;
  BGV, BFV, and CKKS schemes; noise management, packing, and rescaling. Secure
  computation: secret sharing, oblivious transfer, garbled circuits and Yao's
  protocol. Zero-knowledge proofs. Applications: privacy-preserving machine
  learning.

objectives:
  - Introduce the students to the emerging field of encrypted computing.
  - Expose students to the state-of-the-art algorithms in homomorphic encryption and secure multiparty computation.

outcomes:
  - Explain various encrypted computing techniques and algorithms.
  - Identify the advantages and challenges of different encrypted computing algorithms.
  - Apply appropriate encrypted computing techniques based on the application's requirements.
  - Design new encrypted computing techniques and protocols.

