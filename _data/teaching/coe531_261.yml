code: COE 531
title: Advanced Quantum Computing and Communication
term: Fall 2026 (Term 261)
department: Computer Engineering Department
syllabus: /files/COE531-261/COE 531 Syllabus.pdf

info:
  - label: Lectures
    value: Monday & Wednesday, 8:10–9:25 PM
  - label: Office hours
    value: Monday & Wednesday, 9:30–10:30 PM on Teams (or message me on Teams)
  - label: Prerequisites
    value: Graduate standing
  - label: Textbook
    value: "Quantum Computing and Information: A Scaffolding Approach"

description: >-
  Combinatorial optimization. Quantum optimization. Variational quantum
  algorithms. Quantum noise models. Quantum error-correction. Quantum
  fault-tolerance. Quantum communication protocols. Quantum key exchange: BB84.
  Quantum Internet.

objectives:
  - Expose the students to advanced quantum algorithms in the NISQ era.
  - Introduce the students to theoretical and practical knowledge for building quantum communication protocols.

outcomes:
  - Explain the underlying principles of quantum combinatorial optimization problems, and discuss the potential applications.
  - Understand the correct type of quantum algorithm for each problem.
  - Design and analyze variational quantum algorithms.
  - Identify the challenges of transferring quantum information.
  - Implement and utilize quantum error-correction codes to enhance the reliability of quantum computing systems.

