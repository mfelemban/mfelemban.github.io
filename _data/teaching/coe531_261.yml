projects:
  - title: Optimization problems
    items:
      - Radio antenna placement for network coverage optimization
      - Autonomous mission routing for high-risk environments
      - Optimized spectrum and frequency assignment
      - Optimized satellite tasking and mission scheduling
      - Network resilience analysis and critical node identification
  - title: Partial differential equations
    items:
